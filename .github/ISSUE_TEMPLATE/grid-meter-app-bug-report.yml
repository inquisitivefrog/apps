name: "grid-meter-app: Bug report"
description: Report a bug in grid-meter-app (api, frontend, k8s, infra/observability, or load-tests)
title: "[grid-meter-app] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A short summary of the bug.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - api
        - frontend
        - k8s
        - infra/observability
        - load-tests
        - other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: "critical: broken/blocking core flow. high: broken but has a workaround. medium: real bug, not blocking. low: cosmetic/minor."
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, including any relevant environment (docker compose vs. kind, browser vs. curl, etc.)
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Logs, screenshots, links to relevant commits/PRs, etc. (optional)
    validations:
      required: false
