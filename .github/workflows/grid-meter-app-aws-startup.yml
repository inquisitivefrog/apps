name: grid-meter-app AWS startup

# Nightly cold-start of the AWS free-tier demo deployment, mirroring exactly the sequence used
# interactively all through the 2026-10-06 session that built this (see
# status/claude_code_2026-10-06.md): terraform apply -> terraform/aws/check-resources-aws.sh ->
# k8s/deploy-aws.sh -> k8s/check-resources-aws.sh -> kubectl get nodes|services|pods, plus a final
# end-to-end login check as the real "is the app actually usable" gate.
#
# Paired with grid-meter-app-aws-teardown.yml, which destroys everything the evening before -
# see that workflow's own header comment for why a full nightly destroy/recreate cycle costs
# meaningfully less than leaving the non-stoppable resources (EKS control plane, NAT Gateway,
# ElastiCache, Load Balancer - none of which have a stop/start feature) running 24/7.
#
# Deliberately separate from grid-meter-app-ci.yml/e2e.yml/load-test.yml (the original local/kind
# demo's own pipelines) - this is a genuinely different deployment target with its own real AWS
# cost and its own dedicated, least-privilege CI IAM user (grid-meter-app-ci), not a variant of
# the existing CI story.
#
# Cron caveat: GitHub Actions cron is UTC-only, no timezone/DST awareness. 11:00 UTC is 4:00am
# PDT (daylight) but 3:00am PST (standard time) - this workflow will run an hour earlier than
# intended for roughly half the year. Not worth the complexity of two seasonal cron entries for a
# demo project; re-check this if interviews are ever scheduled during PST months and the buffer
# before 5am matters.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-2
  # Every script this workflow calls (terraform/aws/check-resources-aws.sh, k8s/deploy-aws.sh,
  # k8s/check-resources-aws.sh) reads a named AWS CLI profile via `terraform output -raw
  # aws_profile`, which defaults to the literal string "grid-meter-freetier" - not this user's
  # actual identity name, just the profile name terraform/aws/variables.tf happens to use. The
  # "Configure AWS profile" step below creates a LOCAL profile under that same name on the
  # ephemeral runner, backed by the real grid-meter-app-ci user's keys, so none of those scripts
  # need any modification to run unattended here.
  AWS_PROFILE: grid-meter-freetier
  # The persistent Elastic IP's values (bootstrap-freetier/eip.tf) are genuinely static - the
  # whole point of pinning it - but that module's Terraform state is LOCAL-only (not the S3
  # remote backend, deliberately, to avoid a circular bootstrap problem), so a fresh CI
  # checkout has no state to read them from at all. Declared here as repo variables instead of
  # re-reading via cross-state `terraform output` each run - confirmed live (2026-10-07) that
  # read fails on a fresh checkout. k8s/deploy-aws.sh prefers these env vars when set, falling
  # back to the Terraform read for local/human use. Update both (`gh variable set
  # EIP_ALLOCATION_ID`/`EIP_PUBLIC_IP`) if the EIP is ever recreated - it shouldn't be, by
  # design, but if it is, these go stale silently otherwise.
  EIP_ALLOCATION_ID: ${{ vars.EIP_ALLOCATION_ID }}
  EIP_PUBLIC_IP: ${{ vars.EIP_PUBLIC_IP }}

jobs:
  startup:
    runs-on: ubuntu-latest
    # Bumped from 45 to 60 (2026-10-07) - adding ~14 min of load tests (steady-state + ramp-up +
    # tuned rapid-spike, confirmed via real timed runs) on top of the existing ~9 min deploy
    # cycle leaves less margin than is comfortable at 45, especially given CI-runner performance
    # variability this project hasn't characterized yet.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # This workflow FILE must live on the default branch for GitHub Actions to discover
          # its schedule/workflow_dispatch triggers at all (a hard platform constraint, not a
          # choice) - but the actual AWS infra/app code this workflow operates on is
          # deliberately kept isolated on aws-freetier (see that branch's own commit history:
          # this is a from-scratch AWS free-tier adaptation of a legacy project, kept separate
          # on purpose). Explicitly checking out aws-freetier here means main gains only this
          # thin trigger definition, never the AWS-specific substance.
          ref: aws-freetier

      - name: Configure AWS profile
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_CI_ACCESS_KEY_ID }}" --profile "$AWS_PROFILE"
          aws configure set aws_secret_access_key "${{ secrets.AWS_CI_SECRET_ACCESS_KEY }}" --profile "$AWS_PROFILE"
          aws configure set region "$AWS_REGION" --profile "$AWS_PROFILE"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.2'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # --- Step 1: terraform init | fmt | validate | plan | apply ---
      - name: Terraform init
        working-directory: grid-meter-app/terraform/aws
        run: terraform init -input=false

      # k8s/deploy-aws.sh reads EIP outputs from bootstrap-freetier/'s own, separate Terraform
      # state (persistent layer, never touched by this workflow's own apply/destroy - see that
      # module's eip.tf). It needs its own independent `terraform init` - confirmed live
      # (2026-10-07) that skipping this fails deploy-aws.sh with "Required plugins are not
      # installed" the moment it tries to read that output, since a fresh CI checkout has no
      # .terraform/ cache there at all. Never surfaced locally because this directory has stayed
      # initialized on this Mac since it was first bootstrapped.
      - name: Terraform init (bootstrap-freetier, for deploy-aws.sh's EIP output reads)
        working-directory: grid-meter-app/terraform/aws/bootstrap-freetier
        run: terraform init -input=false

      - name: Terraform fmt check
        working-directory: grid-meter-app/terraform/aws
        run: terraform fmt -check

      - name: Terraform validate
        working-directory: grid-meter-app/terraform/aws
        run: terraform validate

      - name: Terraform plan
        working-directory: grid-meter-app/terraform/aws
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: grid-meter-app/terraform/aws
        # Applying a saved plan file is already non-interactive by design (no -auto-approve
        # needed or meaningful here - confirmed throughout this session, every manual
        # `terraform apply "tfplan"` command ran with zero prompt). The real, deliberate, scoped
        # exception to this project's "a human always runs real apply/destroy" rule is this whole
        # workflow existing and running unattended on a schedule at all - every interactive
        # session (Claude Code included) keeps running plan/apply by hand as before.
        run: terraform apply -input=false tfplan

      # --- Step 2: terraform/aws/check-resources-aws.sh ---
      - name: Verify Terraform-provisioned AWS resources
        working-directory: grid-meter-app/terraform/aws
        run: ./check-resources-aws.sh

      # --- Step 3: k8s/deploy-aws.sh ---
      - name: Deploy to AWS (build+push images, apply k8s manifests)
        run: ./grid-meter-app/k8s/deploy-aws.sh

      # --- Step 4: k8s/check-resources-aws.sh ---
      - name: Verify Kubernetes-deployed app layer
        run: ./grid-meter-app/k8s/check-resources-aws.sh

      # --- Step 5: kubectl get nodes|services|pods ---
      - name: Cluster snapshot (nodes/services/pods)
        if: always()
        run: |
          kubectl get nodes -o wide
          echo
          kubectl get services -A -o wide
          echo
          kubectl get pods -A -o wide

      # --- Final gate: real end-to-end login, the actual "is the app usable" check ---
      # Tests the persistent Elastic IP directly, not the NLB's own `kubectl get svc` hostname -
      # the EIP is the address that's actually supposed to stay stable and resume-facing (the
      # entire point of terraform/aws/bootstrap-freetier/eip.tf); the NLB's own hostname is an
      # internal implementation detail that changes every rebuild, same as the Classic ELB it
      # replaced.
      - name: End-to-end login health check
        run: |
          echo "Testing login against http://$EIP_PUBLIC_IP"
          HTTP_STATUS="$(curl -s -o /tmp/login-response.json -w '%{http_code}' -X POST \
            "http://$EIP_PUBLIC_IP/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"username":"demo","password":"GridMeter!Demo2026"}')"
          echo "HTTP status: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Login check failed - app is not actually usable despite passing resource checks."
            cat /tmp/login-response.json
            exit 1
          fi
          echo "Login check passed. App reachable at http://$EIP_PUBLIC_IP"

      # --- Daily performance validation (steady-state / ramp-up / rapid-spike) ---
      # Added 2026-10-07 after live-tuning each profile against this specific free-tier
      # architecture (not the defaults load-tests/README.md documents, which assume a larger
      # deployment target): steady-state and ramp-up pass cleanly at their existing defaults
      # (confirmed live: 18,327 and 107,944 samples respectively, 0% errors, p95 well under the
      # 500ms ceiling both times). rapid-spike's own default (600 threads, 10s ramp) is NOT safe
      # here - confirmed live it produces a 32.57% error rate and a 12-second p95, a genuine
      # capacity failure, not a flaky result. Reduced to 100 threads (still the same fast 10s
      # ramp, so still a real "shock" test, just not 6x past where this architecture's ceiling
      # actually is) - confirmed live that passes cleanly (0% errors, p95 316ms). soak (1hr) and
      # gentle-spike are deliberately NOT included here - soak's duration alone would roughly
      # double this job's runtime for a leak-detection purpose that doesn't fit a daily gate, and
      # gentle-spike tests the same overload point as rapid-spike via a different onset speed,
      # redundant for a pass/fail gate (both already documented as testing the same ceiling in
      # load-tests/README.md's own profile table).
      #
      # Each run.sh call below gates on load-tests/check-thresholds.sh's own pass/fail logic
      # (error rate < 1%, p95 < 500ms) and exits non-zero on breach, failing this step (and the
      # job) the same way every other gate in this workflow does - no separate pass/fail
      # wiring needed here.
      - name: Set up Java (for JMeter's own JRE - NOT this project's pinned Java 25)
        # JMeter 5.6.3 can't run its bundled Groovy/ASM under Java 25 (JSR223 script compilation
        # fails with "Unsupported class file major version 69") - see
        # docs/tech-stack-versions.md's JMeter entry and grid-meter-app-load-test.yml's identical
        # setup, which first found this via a real failed CI run.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JMeter 5.6.3
        # Same permanent-archive download as grid-meter-app-load-test.yml, not the closer.lua
        # mirror redirect (not reproducible) - matches docs/tech-stack-versions.md's pin.
        run: |
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz" -o /tmp/jmeter.tgz
          tar -xzf /tmp/jmeter.tgz -C /opt
          echo "/opt/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      - name: Load test - steady-state
        working-directory: grid-meter-app/load-tests
        run: ./run.sh steady-state -Jhost="$EIP_PUBLIC_IP" -Jport=80

      - name: Load test - ramp-up
        working-directory: grid-meter-app/load-tests
        run: ./run.sh ramp-up -Jhost="$EIP_PUBLIC_IP" -Jport=80

      - name: Cooldown before rapid-spike
        # Added 2026-10-07 after Run #8: steady-state and ramp-up together push ~10 minutes of
        # continuous traffic through the same 2 pods with 0% errors but climbing p95 (197ms ->
        # 295ms), then rapid-spike landed exactly on its 500ms ceiling (FAIL, >=) even though it
        # passed standalone earlier the same day at 316ms. Error rate stayed 0% throughout - this
        # is accumulated pressure (GC/connection-pool/thread-pool) from the back-to-back sequence,
        # not rapid-spike's own 100-thread tuning being wrong. A pause lets that settle before the
        # spike profile runs, matching the standalone conditions it was actually tuned under.
        run: sleep 60

      - name: Load test - rapid-spike (tuned to 100 threads for this architecture)
        working-directory: grid-meter-app/load-tests
        run: ./run.sh rapid-spike -Jhost="$EIP_PUBLIC_IP" -Jport=80 -Jthreads=100

      # --- Demo-data polish ---
      # Added 2026-10-07: the full nightly destroy/rebuild wipes RDS completely, so anything
      # seeded "once" is gone by the next morning - these have to run every day, not just the
      # one time they were first tried manually, or the demo comes up with no status variety
      # and no reading history at all. common/provision-meters.jmx (used by the load tests
      # above) only ever creates ACTIVE meters, so INACTIVE/MAINTENANCE examples need a
      # separate step; readings from the load tests are all "now"-timestamped by design (they're
      # validating real-time ingestion, not generating demo data - see
      # scripts/seed-historical-readings.sh's own header comment), so the Readings page needs
      # this explicit backfill to look like a real system with history rather than a pile of
      # traffic from whenever the load tests last ran.
      - name: Seed meter status variety (INACTIVE/MAINTENANCE)
        run: |
          TOKEN="$(curl -s -X POST "http://${EIP_PUBLIC_IP}/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"username":"demo","password":"GridMeter!Demo2026"}' | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')
          for mstatus in INACTIVE MAINTENANCE; do
            for i in 1 2 3; do
              curl -sf -X POST "http://${EIP_PUBLIC_IP}/api/v1/meters" \
                -H "Authorization: Bearer $TOKEN" \
                -H 'Content-Type: application/json' \
                -d "{\"serialNumber\":\"DEMO-${mstatus}-${i}-$(date +%s)${RANDOM}\",\"location\":\"Demo pool\",\"status\":\"${mstatus}\",\"installedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
                -o /dev/null
            done
          done

      - name: Seed historical readings
        run: ./grid-meter-app/scripts/seed-historical-readings.sh "$EIP_PUBLIC_IP" 80
