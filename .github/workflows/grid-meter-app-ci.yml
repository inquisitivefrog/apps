name: grid-meter-app CI

on:
  push:
    paths:
      - "grid-meter-app/**"
  pull_request:
    paths:
      - "grid-meter-app/**"
  workflow_dispatch: {}

jobs:
  test:
    name: Unit + component tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: grid-meter-app/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Component tests (JUnit 5 + Testcontainers) spin up real Postgres/Kafka/Redis
      # against the Docker daemon already available on ubuntu-latest runners — no
      # services: block needed, this runs the same suite as `mvn test` locally.
      - name: Run unit + component tests
        run: mvn -B test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: grid-meter-app/api/target/surefire-reports/

  frontend-test:
    name: Frontend typecheck, tests, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: grid-meter-app/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: grid-meter-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Vitest + Testing Library (unit/component tier). tsc -b inside `npm run build`
      # below also re-typechecks the test files since they live under src/.
      - name: Run frontend tests
        run: npm test

      - name: Typecheck and build
        run: npm run build
