spring:
  application:
    name: grid-meter-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gridmeter}
    username: ${SPRING_DATASOURCE_USERNAME:gridmeter}
    password: ${SPRING_DATASOURCE_PASSWORD:gridmeter}
    # Explicit, not left as an unlisted HikariCP default (same reasoning as server.tomcat below) --
    # discoverable and tunable here rather than requiring a reader to already know HikariCP's own
    # defaults. maximum-pool-size/idle-timeout/max-lifetime/validation-timeout are HikariCP's own
    # defaults, written down deliberately. connection-timeout is NOT the 30s default -- a real
    # chaos-demo.sh postgres outage showed requests hanging up to 30007ms (matching that default
    # almost exactly) instead of failing fast: ReadingService.ingest() calls
    # meterRepository.existsById() synchronously before publishing to Kafka, so every thread
    # needing a connection during an outage blocked for up to 30s rather than erroring, collapsing
    # throughput (~480 samples/5s down to ~20) and diluting the resulting error rate well below
    # any alert's threshold -- the app absorbed a real outage as latency, not as visible errors.
    # 5s fails fast enough to surface as real errors within a realistic outage window, without
    # being so short that normal pool contention under genuine load causes spurious failures.
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 5000
      # SPRING_DATASOURCE_URL now routes through Traefik's :55432 entrypoint to whichever Patroni
      # node is currently primary (docs/postgres-ha-scope.md's "Patroni deployment model" S4) --
      # but a connection already open before a failover keeps talking to that same node for its
      # whole lifetime; Traefik can't migrate an established TCP connection. A pooled connection
      # to a node Patroni has since demoted still passes HikariCP's own Connection.isValid() check
      # (the socket and Postgres backend are both alive -- only writes are rejected), so without
      # this override the pool would keep handing it out and every write through it would keep
      # failing with the same read-only error until max-lifetime eventually recycled it. Forces an
      # immediate evict-and-retry-with-a-fresh-connection the moment a write hits Postgres'
      # read-only-transaction SQLState (25006) instead. See PrimaryFailoverSQLExceptionOverride's
      # own Javadoc for the full mechanism.
      exception-override-class-name: com.gridmeter.api.config.PrimaryFailoverSQLExceptionOverride

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Undeclared here defaults to the raw Kafka client's "1" (leader-only ack), NOT "all" --
      # confirmed via spring-boot-kafka's real sources jar (KafkaProperties.Producer.acks is
      # @Nullable with no default assignment). This silently defeated the readings topic's
      # min.insync.replicas=2 (KafkaTopicConfig.java): that check only fires under acks=all, so
      # with the undeclared "1" default, a write only ever needed the partition LEADER's ack,
      # regardless of how many replicas were actually in sync. Reproduced live
      # (load-tests/kafka-acks-gap-repro.sh): stopped both followers for a target partition,
      # sent a write, got 201 in under a second even though only the leader had it -- then killed
      # that leader too and watched a follower with NO copy of the write get elected leader
      # anyway (real unclean leader election, not just a theoretical risk). The write happened to
      # survive once the original leader rejoined, only because no conflicting write landed on
      # the data-less leader in the meantime -- a timing-dependent survival, not a guarantee.
      # acks=all makes the producer wait for min.insync.replicas (2 of 3) to acknowledge, so the
      # same scenario now fails/blocks the write instead of silently accepting one only 1 broker
      # has -- verified live post-fix, same script, same scenario.
      acks: all
      # Explicit, not left as an unlisted client default (same reasoning as datasource.hikari
      # above) -- max-block-ms is what actually bounds how long ReadingService.ingest()'s
      # kafkaTemplate.send() call can hang the calling Tomcat thread when Kafka is unreachable.
      # send() is fire-and-forget (no .get()), but the producer still blocks synchronously inside
      # send() itself while it can't fetch fresh cluster metadata for the topic. A real Kafka
      # stop/restart test (46s outage) showed individual requests blocking up to ~49.8s before
      # succeeding once Kafka came back -- close to, but under, this 60s default. Written down
      # deliberately so the ceiling this app is relying on is visible, not an unlisted default a
      # reader would have to already know the Kafka client's internals to explain.
      # Same treatment as max-block-ms above. This is the OTHER, separate ceiling in the send()
      # lifecycle: max.block.ms only bounds the synchronous send() call itself (metadata fetch);
      # delivery.timeout.ms bounds the producer's own background retry loop for the actual
      # broker acknowledgment, which runs after send() has already returned. A real Kafka
      # quorum-loss test (150s outage, past this 120000ms default) confirmed 10 readings were
      # permanently lost when this ceiling expired mid-outage, with the HTTP response already
      # long gone (201, returned near-instantly) -- see ReadingService.ingest()'s own comment and
      # load-tests/README.md's Kafka HA section for the full investigation. Declared at its
      # existing default value deliberately, not shortened or lengthened: changing this number
      # doesn't fix data loss during an outage longer than it. A durable fix (transactional
      # outbox) was built, load-tested, and deliberately retired -- docs/resilience-scope.md's
      # redo-path decision concluded a lost simulated reading has no real consequence worth it --
      # so the fix landing alongside this declaration is visibility (a whenComplete callback
      # logging the failure and incrementing a counter/alert), not prevention, by design.
      properties:
        max.block.ms: 60000
        delivery.timeout.ms: 120000
    consumer:
      group-id: grid-meter-api
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.gridmeter.api.reading

  data:
    redis:
      # Sentinel-aware, not a fixed host:port -- closes docs/redis-ha-scope.md's Stage 6 gap
      # (the app-vs-infrastructure gap docs/ha-scope.md's standing lesson also named for
      # Postgres): Stages 1-5 validated Sentinel/Redis failover directly via redis-cli, but the
      # app's own client was still a fixed connection to the `redis` container specifically, with
      # no idea a failover could ever happen. Lettuce (the default client) discovers the current
      # master by asking the Sentinels, and subscribes to their pubsub for +switch-master events,
      # so it re-points itself automatically when Sentinel promotes a replica -- no separate
      # routing/proxy layer needed the way Postgres needed Traefik + Consul Catalog, since
      # Sentinel awareness lives in the client itself here.
      sentinel:
        master: ${SPRING_REDIS_SENTINEL_MASTER:mymaster}
        nodes: ${SPRING_REDIS_SENTINEL_NODES:localhost:26379}

logging:
  pattern:
    # Appends customerId (set into MDC by JwtAuthenticationFilter, see docs/multi-tenancy-scope.md)
    # to every log line's level segment, so it lands in stdout -> Alloy -> Loki without a separate
    # structured-logging setup. ":-" falls back to empty for unauthenticated requests (login,
    # actuator) where no customerId is in scope yet.
    level: "%5p [customerId=%X{customerId:-}]"

server:
  port: 8080
  tomcat:
    # Explicit, not left as an accident of the parent POM's defaults — these ARE the parent POM's
    # defaults (200/10/100), but written down deliberately because the load-tests/ spike profile's
    # entire purpose is probing this exact ceiling: 2 replicas x threads.max=200 = 400 total
    # request-handling threads before requests start queuing at accept-count. See load-tests/README.md.
    threads:
      max: 200
      min-spare: 10
    # Overridable via SERVER_TOMCAT_ACCEPT_COUNT (same pattern as
    # GRID_METER_TRACING_SAMPLING_PROBABILITY below) so load-tests/misconfigured-spike-demo.sh can
    # deliberately run api with an under-provisioned queue and show the contrast against this
    # properly-configured default -- see load-tests/README.md.
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    # Without this, Micrometer's Tomcat binder has no JMX MBean data to read thread-pool/connection
    # metrics from, so tomcat_threads_busy_threads / tomcat_connections_current never appear on
    # /actuator/prometheus at all — only tomcat_sessions_* does. Discovered 2026-08-25: this project
    # had documented "watch tomcat.threads.busy in Grafana during spike/soak" (load-tests/README.md)
    # since the load-test tier was built, but the metric was never actually exposed.
    mbeanregistry:
      enabled: true
    accesslog:
      enabled: true
      directory: /dev
      prefix: stdout
      buffered: false
      suffix: ""
      file-date-format: ""

management:
  # OTLP metrics export is disabled via MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
  # in docker-compose.yml, not here — this property does not take effect when
  # set in application.yml (confirmed 2026-08-10). Prometheus scraping via
  # /actuator/prometheus is the real metrics pipeline; OTLP metrics export
  # would be redundant with it even if working.  
  # ie. management.otlp.metrics.export.enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # Spring Boot only auto-enables the liveness/readiness health groups when it detects a
      # Kubernetes environment (KUBERNETES_SERVICE_HOST) -- Docker Compose never sets that, so
      # without this the /actuator/health/readiness endpoint Traefik's healthcheck now targets
      # (docker-compose.yml) would 404. The readiness group defaults to just
      # ReadinessStateHealthIndicator (tracks Spring's own startup/shutdown lifecycle state) --
      # it does NOT pull in the DataSource/Kafka/Redis indicators that feed the full aggregate
      # /actuator/health, which is exactly the point: those dependencies are each a single
      # shared instance behind both api replicas, so gating routing on their health doesn't buy
      # any real failover (every replica would report the same DOWN simultaneously) -- it just
      # takes ALL traffic offline for a problem that isn't replica-specific. See docker-compose.yml
      # for the incident this fixed: a Kafka-only outage was taking down GET /meters, GET
      # /readings, and POST /meters too, none of which touch Kafka.
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        # Without this, http_server_requests_seconds only exposes _sum/_count, not the _bucket
        # series histogram_quantile() needs — no p95/p99 latency panel is possible without it.
        # Scoped to this one meter (not global) to avoid unbounded cardinality/memory cost.
        http.server.requests: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
  tracing:
    sampling:
      # 100% by default for normal dev (full traces are useful day to day). Override via
      # GRID_METER_TRACING_SAMPLING_PROBABILITY for a load test run — see load-tests/README.md.
      probability: ${GRID_METER_TRACING_SAMPLING_PROBABILITY:1.0}

grid-meter:
  pagination:
    default-size: 20
    max-size: 100
  kafka:
    readings-topic: readings
    # 3 brokers, tolerate one down without losing durability -- see docs/ha-scope.md and
    # KafkaTopicConfig's own comment for the quorum/acks reasoning. ComponentTestSupport overrides
    # both to 1 for its single-broker Testcontainers Kafka, where these real values aren't
    # satisfiable.
    readings-topic-replicas: 3
    readings-topic-min-insync-replicas: 2
  security:
    jwt:
      # HS256 requires a >=256-bit key or JJWT throws WeakKeyException at startup — this
      # default is a real openssl-rand-base64-32-generated key, not a placeholder string.
      # docker-compose.yml sets GRID_METER_JWT_SECRET explicitly, mirroring how
      # SPRING_DATASOURCE_PASSWORD is set explicitly there rather than relying on this default.
      secret: ${GRID_METER_JWT_SECRET:4H+9b+HAJnUJhWU+mEKE09Onq9J4VzpLkSG3zL4pvAs=}
      expiration-minutes: 60
