spring:
  application:
    name: grid-meter-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gridmeter}
    username: ${SPRING_DATASOURCE_USERNAME:gridmeter}
    password: ${SPRING_DATASOURCE_PASSWORD:gridmeter}
    # Explicit, not left as an unlisted HikariCP default (same reasoning as server.tomcat below) --
    # discoverable and tunable here rather than requiring a reader to already know HikariCP's own
    # defaults. maximum-pool-size/idle-timeout/max-lifetime/validation-timeout are HikariCP's own
    # defaults, written down deliberately. connection-timeout is NOT the 30s default -- a real
    # chaos-demo.sh postgres outage showed requests hanging up to 30007ms (matching that default
    # almost exactly) instead of failing fast: ReadingService.ingest() calls
    # meterRepository.existsById() synchronously before publishing to Kafka, so every thread
    # needing a connection during an outage blocked for up to 30s rather than erroring, collapsing
    # throughput (~480 samples/5s down to ~20) and diluting the resulting error rate well below
    # any alert's threshold -- the app absorbed a real outage as latency, not as visible errors.
    # 5s fails fast enough to surface as real errors within a realistic outage window, without
    # being so short that normal pool contention under genuine load causes spurious failures.
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Explicit, not left as an unlisted client default (same reasoning as datasource.hikari
      # above) -- max-block-ms is what actually bounds how long ReadingService.ingest()'s
      # kafkaTemplate.send() call can hang the calling Tomcat thread when Kafka is unreachable.
      # send() is fire-and-forget (no .get()), but the producer still blocks synchronously inside
      # send() itself while it can't fetch fresh cluster metadata for the topic. A real Kafka
      # stop/restart test (46s outage) showed individual requests blocking up to ~49.8s before
      # succeeding once Kafka came back -- close to, but under, this 60s default. Written down
      # deliberately so the ceiling this app is relying on is visible, not an unlisted default a
      # reader would have to already know the Kafka client's internals to explain.
      properties:
        max.block.ms: 60000
    consumer:
      group-id: grid-meter-api
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.gridmeter.api.reading

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

logging:
  pattern:
    # Appends customerId (set into MDC by JwtAuthenticationFilter, see docs/multi-tenancy-scope.md)
    # to every log line's level segment, so it lands in stdout -> Alloy -> Loki without a separate
    # structured-logging setup. ":-" falls back to empty for unauthenticated requests (login,
    # actuator) where no customerId is in scope yet.
    level: "%5p [customerId=%X{customerId:-}]"

server:
  port: 8080
  tomcat:
    # Explicit, not left as an accident of the parent POM's defaults — these ARE the parent POM's
    # defaults (200/10/100), but written down deliberately because the load-tests/ spike profile's
    # entire purpose is probing this exact ceiling: 2 replicas x threads.max=200 = 400 total
    # request-handling threads before requests start queuing at accept-count. See load-tests/README.md.
    threads:
      max: 200
      min-spare: 10
    # Overridable via SERVER_TOMCAT_ACCEPT_COUNT (same pattern as
    # GRID_METER_TRACING_SAMPLING_PROBABILITY below) so load-tests/misconfigured-spike-demo.sh can
    # deliberately run api with an under-provisioned queue and show the contrast against this
    # properly-configured default -- see load-tests/README.md.
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    # Without this, Micrometer's Tomcat binder has no JMX MBean data to read thread-pool/connection
    # metrics from, so tomcat_threads_busy_threads / tomcat_connections_current never appear on
    # /actuator/prometheus at all — only tomcat_sessions_* does. Discovered 2026-08-25: this project
    # had documented "watch tomcat.threads.busy in Grafana during spike/soak" (load-tests/README.md)
    # since the load-test tier was built, but the metric was never actually exposed.
    mbeanregistry:
      enabled: true
    accesslog:
      enabled: true
      directory: /dev
      prefix: stdout
      buffered: false
      suffix: ""
      file-date-format: ""

management:
  # OTLP metrics export is disabled via MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
  # in docker-compose.yml, not here — this property does not take effect when
  # set in application.yml (confirmed 2026-08-10). Prometheus scraping via
  # /actuator/prometheus is the real metrics pipeline; OTLP metrics export
  # would be redundant with it even if working.  
  # ie. management.otlp.metrics.export.enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        # Without this, http_server_requests_seconds only exposes _sum/_count, not the _bucket
        # series histogram_quantile() needs — no p95/p99 latency panel is possible without it.
        # Scoped to this one meter (not global) to avoid unbounded cardinality/memory cost.
        http.server.requests: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
  tracing:
    sampling:
      # 100% by default for normal dev (full traces are useful day to day). Override via
      # GRID_METER_TRACING_SAMPLING_PROBABILITY for a load test run — see load-tests/README.md.
      probability: ${GRID_METER_TRACING_SAMPLING_PROBABILITY:1.0}

grid-meter:
  pagination:
    default-size: 20
    max-size: 100
  kafka:
    readings-topic: readings
  security:
    jwt:
      # HS256 requires a >=256-bit key or JJWT throws WeakKeyException at startup — this
      # default is a real openssl-rand-base64-32-generated key, not a placeholder string.
      # docker-compose.yml sets GRID_METER_JWT_SECRET explicitly, mirroring how
      # SPRING_DATASOURCE_PASSWORD is set explicitly there rather than relying on this default.
      secret: ${GRID_METER_JWT_SECRET:4H+9b+HAJnUJhWU+mEKE09Onq9J4VzpLkSG3zL4pvAs=}
      expiration-minutes: 60
