# Docker's default json-file logging driver has NO size cap -- every container's stdout/stderr
# accumulates forever inside Docker Desktop's VM disk until the container is removed. This bit
# repeatedly during load testing and the Kafka TRACE-debug overlay (docker-compose.kafka-debug.yml)
# work: high-request-volume load tests generate large Traefik/api access logs, `--scale api=2`
# multiplies that per replica, and none of it was ever capped -- a real, repeated cause of Docker
# Desktop's VM disk (Docker.raw) growing to consume nearly all host disk across several sessions
# (see status/ for the incident history). 10m x 3 files = 30MB cap per container instance, still
# comfortably enough for `docker compose logs` to be useful for recent debugging.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.7.10
    logging: *default-logging
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      # Exposed on the same internal :8080 entrypoint as the dashboard/API above, at /metrics --
      # scraped by Prometheus below. Needed because a request Tomcat's accept-count queue refuses
      # never reaches api's own Spring MVC layer at all, so Micrometer's http.server.requests
      # metric never sees it (not as a success, not as a failure) -- Traefik itself is what
      # generates the resulting 502, so it's the only place this failure class is visible.
      - --metrics.prometheus=true
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - grid-meter

  frontend:
    build:
      context: ./frontend
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=80
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - grid-meter

  api:
    build:
      context: ./api
    logging: *default-logging
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gridmeter
      SPRING_DATASOURCE_USERNAME: gridmeter
      SPRING_DATASOURCE_PASSWORD: gridmeter
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      GRID_METER_JWT_SECRET: 4H+9b+HAJnUJhWU+mEKE09Onq9J4VzpLkSG3zL4pvAs=
      # Passed through from the host shell (default 1.0, normal dev) so a load-test run can
      # `export GRID_METER_TRACING_SAMPLING_PROBABILITY=0.05` before `docker compose up` without
      # editing this file — see load-tests/README.md.
      GRID_METER_TRACING_SAMPLING_PROBABILITY: ${GRID_METER_TRACING_SAMPLING_PROBABILITY:-1.0}
      # Passed through so load-tests/misconfigured-spike-demo.sh can deliberately run api with an
      # under-provisioned Tomcat accept-count (default 100, see application.yml) without editing
      # this file — same pattern as the tracing-sampling override above.
      SERVER_TOMCAT_ACCEPT_COUNT: ${SERVER_TOMCAT_ACCEPT_COUNT:-100}
      JAVA_TOOL_OPTIONS: -Xmx384m
      # Disables Micrometer's OTLP metrics push (Prometheus scrape is the real
      # pipeline). Must be set here, not in application.yml — see comment there.
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
    depends_on:
      - postgres
      - kafka-1
      - kafka-2
      - kafka-3
      - redis
    # Discovered 2026-08-25 via load-tests/chaos-demo.sh: restarting the api container can
    # occasionally race Docker's embedded DNS registering "kafka" again fast enough -- Spring
    # Kafka builds its consumer eagerly within the first second of context startup, and a resolve
    # failure there is fatal (crashes the whole app, not just the listener) with no default restart
    # policy, so it stays dead. A transient DNS race on restart should be retried, not fatal.
    restart: on-failure:5
    labels:
      - traefik.enable=true
      # Actuator endpoints live outside /api/v1 deliberately (see api-and-data-model.md) —
      # this rule must route them too, or they silently fall through to the frontend's
      # catch-all PathPrefix(`/`) router instead of ever reaching this service.
      - traefik.http.routers.api.rule=PathPrefix(`/api`) || PathPrefix(`/actuator`)
      - traefik.http.routers.api.priority=10
      - traefik.http.services.api.loadbalancer.server.port=8080
      # Without this, Traefik had NO active check at all for api -- not even TCP-level -- and would
      # keep routing to a replica whose /actuator/health aggregate status is DOWN (e.g. from
      # ReadingsKafkaHealthIndicator during a Kafka outage) for as long as its container process is
      # still running and the port accepts connections. Found while verifying that indicator
      # actually had a consumer -- it didn't, making the whole health-indicator investment inert.
      # Spring Boot Actuator maps a DOWN aggregate status to HTTP 503 by default (independent of
      # show-details, which only hides the per-component breakdown, not the status code), and
      # Traefik's healthcheck treats any non-2xx as unhealthy -- no extra status-code config needed.
      #
      # Originally pointed at the full aggregate /actuator/health -- a real load test (measuring
      # outbox growth under a sustained Kafka outage, since retired -- see docs/resilience-scope.md)
      # then showed that config taking down GET /meters, GET /readings, and POST /meters as
      # collateral damage during a Kafka-only outage, none of which touch Kafka. Retargeted at the
      # readiness probe group (application.yml's management.endpoint.health.probes.enabled), which
      # by default tracks only Spring's own startup/shutdown
      # lifecycle state, not the DataSource/Kafka/Redis indicators -- correct here specifically
      # because all three of those are single shared instances behind both api replicas, so
      # gating routing on their health can never provide real per-replica failover (every replica
      # observes the same DOWN simultaneously); it can only ever take all traffic offline for a
      # dependency problem that isn't replica-specific.
      - traefik.http.services.api.loadbalancer.healthcheck.path=/actuator/health/readiness
      - traefik.http.services.api.loadbalancer.healthcheck.interval=10s
      - traefik.http.services.api.loadbalancer.healthcheck.timeout=3s
    deploy:
      resources:
        limits:
          # Bumped from 512m 2026-08-26 -- a real autoscale-demo.sh run under sustained 2-replica
          # load showed api-2 pinned at a literal 100.00% of its 512m limit via `docker stats`. It
          # didn't OOM that run, but the margin was uncomfortably thin: -Xmx384m leaves only 128MB
          # for everything else (metaspace, thread stacks -- 200 Tomcat threads' stacks alone add
          # up, JIT code cache, direct buffers, GC overhead). 768m keeps -Xmx unchanged and just
          # gives that non-heap overhead real room, verified via a real 2-replica rapid-spike run
          # afterward (see load-tests/README.md).
          memory: 768m
          # Bounds docker stats' CPU% to a stable, meaningful number for
          # load-tests/autoscale-watcher.sh's trigger threshold -- without a limit, CPU% is
          # relative to however many cores happen to be free on the host, making "80%" ambiguous
          # and non-reproducible across machines. Matches realistic production practice too (a
          # real container/pod almost always has a CPU limit, not just memory).
          cpus: "1.0"
    networks:
      - grid-meter
    # Run multiple replicas with: docker compose up --scale api=2
    # Traefik's Docker provider auto-discovers and load balances across them.

  postgres:
    image: postgres:18.4
    logging: *default-logging
    environment:
      POSTGRES_DB: gridmeter
      POSTGRES_USER: gridmeter
      POSTGRES_PASSWORD: gridmeter
    volumes:
      - postgres-data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - grid-meter

  # Consul (Stage 0 of docs/postgres-ha-scope.md) -- Patroni's consensus-store backend, standing
  # this up ALONE first, before Postgres/Patroni touch it at all, per that doc's explicit
  # instruction: verify Consul's own quorum behavior as a known-good baseline first, so a
  # Consul-layer problem never gets misdiagnosed as a Patroni/Postgres problem later. 3 server
  # agents -- same "3, not 2" quorum reasoning already established for Kafka's controllers
  # (docs/ha-scope.md) and Redis's Sentinels: tolerates exactly one agent loss while keeping a
  # working 2-of-3 majority. -bootstrap-expect=3 tells each agent to wait for all 3 before forming
  # the cluster; -retry-join uses Docker's own DNS (service names), same pattern as Kafka's
  # KAFKA_CONTROLLER_QUORUM_VOTERS and Redis's Sentinel --sentinel monitor.
  consul-1:
    image: hashicorp/consul:1.20.1
    command: agent -server -bootstrap-expect=3 -node=consul-1 -client=0.0.0.0 -datacenter=dc1 -retry-join=consul-2 -retry-join=consul-3 -ui
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - grid-meter

  consul-2:
    image: hashicorp/consul:1.20.1
    command: agent -server -bootstrap-expect=3 -node=consul-2 -client=0.0.0.0 -datacenter=dc1 -retry-join=consul-1 -retry-join=consul-3 -ui
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - grid-meter

  consul-3:
    image: hashicorp/consul:1.20.1
    command: agent -server -bootstrap-expect=3 -node=consul-3 -client=0.0.0.0 -datacenter=dc1 -retry-join=consul-1 -retry-join=consul-2 -ui
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - grid-meter

  # Postgres HA (Patroni + Consul), Stage 2 of docs/postgres-ha-scope.md. A SEPARATE, isolated
  # 3-node cluster for this investigation -- deliberately NOT touching the app's real `postgres`
  # service or its data, since Postgres is this app's actual system of record (unlike Redis, which
  # is just a cache per architecture.md); this is an investigation into whether Patroni+Consul
  # works correctly, not yet a decision to cut the real app over to it.
  #
  # Each node points at a DIFFERENT Consul server agent (patroni-1->consul-1, etc.), not all 3 at
  # the same one -- a real design tradeoff worth stating: this project doesn't run a per-node local
  # Consul client-agent tier (the standard production pattern for DCS resilience), so pointing
  # every Patroni node at the same single Consul agent would mean that one agent's failure breaks
  # ALL 3 Patroni nodes' DCS connectivity, confounding Stage 5's actual intent (testing behavior
  # under genuine Consul quorum loss, not "one specific agent happens to be down"). Spreading nodes
  # across different agents means an individual agent hiccup only affects 1 of 3 Patroni nodes,
  # while a real 2-of-3 Consul quorum loss still affects all 3 equally, matching what Stage 5
  # actually needs to test.
  #
  # No named volume -- ephemeral data dir inside each container's own writable layer, matching
  # this whole HA investigation's established pattern (Kafka brokers, Redis/Sentinel, Consul
  # agents) of resetting cleanly via --force-recreate between test runs, not persisting state.
  #
  # Dev-only hardcoded credentials, same convention as the app's own `postgres` service.
  patroni-1:
    build:
      context: ./patroni
    environment:
      PATRONI_NAME: patroni-1
      PATRONI_SCOPE: gridmeter-postgres-ha
      PATRONI_CONSUL_HOST: consul-1:8500
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni-1:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni-1:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/patroni-data
      PATRONI_POSTGRESQL_PGPASS: /tmp/pgpass
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: gridmeter
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: gridmeter
    volumes:
      - ./patroni/patroni.yml:/etc/patroni.yml:ro
    logging: *default-logging
    depends_on:
      - consul-1
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - grid-meter

  patroni-2:
    build:
      context: ./patroni
    environment:
      PATRONI_NAME: patroni-2
      PATRONI_SCOPE: gridmeter-postgres-ha
      PATRONI_CONSUL_HOST: consul-2:8500
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni-2:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni-2:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/patroni-data
      PATRONI_POSTGRESQL_PGPASS: /tmp/pgpass
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: gridmeter
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: gridmeter
    volumes:
      - ./patroni/patroni.yml:/etc/patroni.yml:ro
    logging: *default-logging
    depends_on:
      - consul-2
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - grid-meter

  patroni-3:
    build:
      context: ./patroni
    environment:
      PATRONI_NAME: patroni-3
      PATRONI_SCOPE: gridmeter-postgres-ha
      PATRONI_CONSUL_HOST: consul-3:8500
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni-3:8008
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni-3:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/patroni-data
      PATRONI_POSTGRESQL_PGPASS: /tmp/pgpass
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: gridmeter
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: gridmeter
    volumes:
      - ./patroni/patroni.yml:/etc/patroni.yml:ro
    logging: *default-logging
    depends_on:
      - consul-3
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - grid-meter

  # Redis HA (Sentinel) -- see docs/redis-ha-scope.md for the full scope/staging plan. Stage 1's
  # config audit found min-replicas-to-write=0 live on this instance (confirmed via `redis-cli
  # CONFIG GET`, not just a repo grep) -- the direct structural twin of Kafka's undeclared acks=1
  # gap (Finding 1 in docs/testing-strategy-ha-supplement.md): a durability-relevant setting
  # silently defaulting to "no real guarantee" until checked, matching every other instance of this
  # pattern found this session (HikariCP's connection-timeout, Kafka's max.block.ms/
  # delivery.timeout.ms/acks/unclean.leader.election.enable -- see CLAUDE.md's "Architectural
  # decisions to preserve" for the standing principle this became). Declaring it explicitly now
  # that real replicas exist to enforce against, rather than deferring the fix already diagnosed in
  # Stage 1.
  #
  # min-replicas-to-write 1 (not 2, the full replica count) mirrors Kafka's own N=3,
  # min.insync.replicas=2 pattern: require a majority-ish subset (primary + at least 1 of 2
  # replicas), not unanimity from every node, matching this project's established "tolerate one
  # node loss without losing durability" bar rather than a stricter all-replicas requirement that
  # would block writes on a single replica hiccup.
  redis:
    image: redis:8.10
    # Sentinel-aware entrypoint fixes docs/redis-ha-scope.md's Finding A: a plain `redis-server`
    # command has no memory of Sentinel's failover decisions across a restart, so this container
    # would boot back up believing it's still primary even if Sentinel demoted it while it was
    # down -- a real, confirmed split-brain window (see
    # load-tests/vendor-bug-reports/redis/NOTES.md). The entrypoint asks Sentinel who's actually
    # master before starting, instead of trusting this static config to still be true.
    entrypoint: ["/entrypoint.sh"]
    command: ["--min-replicas-to-write", "1", "--min-replicas-max-lag", "10", "--loglevel", "debug"]
    environment:
      MY_HOSTNAME: redis
    volumes:
      - ./scripts/redis-entrypoint.sh:/entrypoint.sh:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - grid-meter

  # 2 replicas -- see docs/redis-ha-scope.md's topology decision: primary + 2 replicas (not 1),
  # so one replica can be down without losing the ability to promote a fully-caught-up standby.
  redis-replica-1:
    image: redis:8.10
    entrypoint: ["/entrypoint.sh"]
    command: ["--loglevel", "debug"]
    environment:
      MY_HOSTNAME: redis-replica-1
      # Only used if Sentinel is genuinely unreachable at startup -- preserves this node's old
      # static assumption instead of risking it silently becoming an unintended second primary.
      FALLBACK_REPLICAOF_HOST: redis
      FALLBACK_REPLICAOF_PORT: "6379"
    volumes:
      - ./scripts/redis-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - redis
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - grid-meter

  redis-replica-2:
    image: redis:8.10
    entrypoint: ["/entrypoint.sh"]
    command: ["--loglevel", "debug"]
    environment:
      MY_HOSTNAME: redis-replica-2
      FALLBACK_REPLICAOF_HOST: redis
      FALLBACK_REPLICAOF_PORT: "6379"
    volumes:
      - ./scripts/redis-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - redis
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - grid-meter

  # 3 Sentinels -- quorum of 2 needed to mark the primary ODOWN and authorize failover (see
  # docs/redis-ha-scope.md's quorum-mechanics section: this `quorum` value gates *detection*: the
  # separate failover-*authorization* step always needs a majority of ALL sentinels, 2 of 3 here,
  # which happens to be the same number in a 3-sentinel deployment but is a distinct mechanism, not
  # the same threshold by coincidence). No sentinel.conf file is mounted -- every directive is
  # passed on the command line and Sentinel is left to create/rewrite its own conf file inside the
  # container's ephemeral writable layer, matching this project's existing no-persistent-volume
  # treatment of the Kafka brokers (state is expected to reset on container recreation).
  sentinel-1:
    image: redis:8.10
    command: sh -c "touch /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel --port 26379 --loglevel debug --sentinel resolve-hostnames yes --sentinel announce-hostnames yes --sentinel monitor mymaster redis 6379 2 --sentinel down-after-milliseconds mymaster 5000 --sentinel failover-timeout mymaster 10000"
    depends_on:
      - redis
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 32m
    networks:
      - grid-meter

  sentinel-2:
    image: redis:8.10
    command: sh -c "touch /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel --port 26379 --loglevel debug --sentinel resolve-hostnames yes --sentinel announce-hostnames yes --sentinel monitor mymaster redis 6379 2 --sentinel down-after-milliseconds mymaster 5000 --sentinel failover-timeout mymaster 10000"
    depends_on:
      - redis
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 32m
    networks:
      - grid-meter

  sentinel-3:
    image: redis:8.10
    command: sh -c "touch /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel --port 26379 --loglevel debug --sentinel resolve-hostnames yes --sentinel announce-hostnames yes --sentinel monitor mymaster redis 6379 2 --sentinel down-after-milliseconds mymaster 5000 --sentinel failover-timeout mymaster 10000"
    depends_on:
      - redis
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 32m
    networks:
      - grid-meter

  # 3-broker KRaft cluster (combined broker+controller roles per node, same as the prior
  # single-node setup, just tripled) — see docs/ha-scope.md for why 3 and not 2: majority is
  # floor(N/2)+1, so a 3-node cluster tolerates exactly one node loss (planned or unplanned) and
  # still holds a working 2-of-3 quorum, which is what makes a single-broker maintenance window
  # safe by construction. Two nodes gives replication but not safe automatic failover — no
  # tiebreaker if they disagree about leadership.
  #
  # CLUSTER_ID must be identical across all three brokers -- it's how they agree they're forming
  # one cluster rather than three independent single-node ones. Generated once via
  # `kafka-storage.sh random-uuid` (the tool Kafka's own docs recommend), not hand-typed, and
  # reused as a literal here since Compose has no cross-service variable-sharing mechanism this
  # project otherwise uses.
  kafka-1:
    image: apache/kafka:4.3.1
    logging: *default-logging
    environment:
      CLUSTER_ID: zWOyaccGQkG1ikHT88v3XA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      # Broker-level default for auto-created topics; the app's own readings topic
      # (KafkaTopicConfig.java) sets both replicas and min.insync.replicas explicitly rather than
      # relying on these broker defaults, matching this project's "declare it" convention
      # (HikariCP, Kafka producer max.block.ms) -- these still matter for Kafka's own internal
      # topics (__consumer_offsets, etc.), which aren't under the app's control.
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      # Declared explicitly rather than relying on Kafka's own default (which happens to also be
      # false) -- see docs/testing-strategy-ha-supplement.md's Finding 2. Confirmed via
      # `kafka-configs.sh --describe --all` that before this line existed, the effective value came
      # from Kafka's DEFAULT_CONFIG synonym tier, not a static override from this project. Declaring
      # it doesn't change behavior (the default already matched) and does NOT close the underlying
      # race-condition finding -- a live dynamic override was independently confirmed not to prevent
      # it either -- this only removes the "true by accident, not by declaration" gap, matching this
      # project's declare-defaults-explicitly convention elsewhere (HikariCP, max.block.ms,
      # delivery.timeout.ms, acks).
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - grid-meter

  kafka-2:
    image: apache/kafka:4.3.1
    logging: *default-logging
    environment:
      CLUSTER_ID: zWOyaccGQkG1ikHT88v3XA
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      # Declared explicitly rather than relying on Kafka's own default (which happens to also be
      # false) -- see docs/testing-strategy-ha-supplement.md's Finding 2. Confirmed via
      # `kafka-configs.sh --describe --all` that before this line existed, the effective value came
      # from Kafka's DEFAULT_CONFIG synonym tier, not a static override from this project. Declaring
      # it doesn't change behavior (the default already matched) and does NOT close the underlying
      # race-condition finding -- a live dynamic override was independently confirmed not to prevent
      # it either -- this only removes the "true by accident, not by declaration" gap, matching this
      # project's declare-defaults-explicitly convention elsewhere (HikariCP, max.block.ms,
      # delivery.timeout.ms, acks).
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - grid-meter

  kafka-3:
    image: apache/kafka:4.3.1
    logging: *default-logging
    environment:
      CLUSTER_ID: zWOyaccGQkG1ikHT88v3XA
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      # Declared explicitly rather than relying on Kafka's own default (which happens to also be
      # false) -- see docs/testing-strategy-ha-supplement.md's Finding 2. Confirmed via
      # `kafka-configs.sh --describe --all` that before this line existed, the effective value came
      # from Kafka's DEFAULT_CONFIG synonym tier, not a static override from this project. Declaring
      # it doesn't change behavior (the default already matched) and does NOT close the underlying
      # race-condition finding -- a live dynamic override was independently confirmed not to prevent
      # it either -- this only removes the "true by accident, not by declaration" gap, matching this
      # project's declare-defaults-explicitly convention elsewhere (HikariCP, max.block.ms,
      # delivery.timeout.ms, acks).
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - grid-meter

  prometheus:
    image: prom/prometheus:v3.11.2
    logging: *default-logging
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - grid-meter

  loki:
    image: grafana/loki:3.7.6
    command: -config.file=/etc/loki/local-config.yaml
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - grid-meter

  tempo:
    image: grafana/tempo:2.10.0
    command: -config.file=/etc/tempo/tempo.yml
    logging: *default-logging
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - grid-meter

  grafana:
    image: grafana/grafana:13.0.2
    logging: *default-logging
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Workaround for Grafana 13 bundled-plugin update bug
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      # Disables Grafana's "Live" websocket streaming feature. Tested as a hypothesis for the OOM
      # investigation below (see the memory limit comment further down) and ruled out -- it did NOT
      # stop the memory growth on its own. Left disabled anyway since chaos-demo.sh's screenshots
      # only need the `refresh=15s` HTTP poll already in its URL, not push-based live updates --
      # one less feature running for no benefit here, not a load-bearing fix.
      GF_LIVE_MAX_CONNECTIONS: "0"
    ports:
      # Direct host access, bypassing Traefik. Needed so dashboard screenshots stay reachable even
      # when Traefik itself is the link being taken offline in load-tests/chaos-demo.sh -- Grafana
      # displays historical Prometheus/Loki/Tempo data and has no reason to depend on Traefik being
      # up. Not used for normal access (that's still http://localhost/grafana/ through Traefik).
      - "3001:3000"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - ./observability/alerting:/etc/grafana/provisioning/alerting:ro
      - grafana-data:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          # Idle/cold-start memory is a comfortable ~155-170MB; one dashboard load (with all its
          # panel queries/JS bundle) settles around ~410-420MB. The real driver behind repeated
          # OOM kills at 256m/384m/768m/1024m during load-tests/chaos-demo.sh development wasn't
          # the memory number at all -- it was screenshot-daemon.js calling page.reload() before
          # every shot, which re-bootstraps Grafana's entire frontend and re-initializes a fresh
          # server-side dashboard view each time even within the same browser session. Navigating
          # once and reusing the already-loaded, auto-refreshing page for every subsequent
          # screenshot plateaus memory instead of climbing unboundedly -- confirmed under a real,
          # full chaos-demo.sh run (background load + all 5 outages + 11 screenshots): it completed
          # successfully end to end with no crash, unlike every earlier reload-based attempt. At
          # 512m it still climbed to the full ceiling by the end (real combined load pushes higher
          # than the ~417-420MB seen testing screenshots in isolation), so 768m for actual headroom
          # rather than leaving ~0MB margin. See status/claude_code_2026-08-24.md for the full
          # investigation.
          memory: 768m
    networks:
      - grid-meter

  alloy:
    image: grafana/alloy:v1.18.1
    logging: *default-logging
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/alloy.river:/etc/alloy/config.alloy:ro
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - grid-meter

  toolbox:
    image: nicolaka/netshoot
    command: sleep infinity
    logging: *default-logging
    profiles:
      - debug
    networks:
      - grid-meter
    deploy:
      resources:
        limits:
          memory: 64m

networks:
  grid-meter:

volumes:
  postgres-data:
  grafana-data:

