# AWS-target variant of api.yaml. Same Deployment shape (2 replicas, matching the "scale api=2"
# story everywhere else), different env var wiring: SPRING_PROFILES_ACTIVE=cloud,cloud-aws
# activates application.yml's plain host/port Redis block instead of Sentinel discovery (see that
# file's own comment for why - a managed Redis endpoint has no Sentinel process to discover at
# all) plus the AWS-specific ElastiCache IAM-auth block (config.aws.AwsRedisConfig), and
# SPRING_DATA_REDIS_HOST/PORT replace SPRING_REDIS_SENTINEL_MASTER/NODES entirely. Kafka stays
# wired exactly as kind's api.yaml does - self-hosted in-cluster identically on every target.
#
# image below is a placeholder - deploy-aws.sh applies this file as-is, then runs
# `kubectl set image` immediately after with the real ECR image reference (a deploy-time fact,
# not something to bake into a static, committed manifest that could go stale).
#
# ServiceAccount below (name "grid-meter-app", namespace default) is what terraform/aws/
# elasticache-iam-auth.tf's IRSA trust policy already expects (its condition is scoped to exactly
# "system:serviceaccount:default:grid-meter-app") - that Terraform was inert without this. Its
# role-arn annotation is a placeholder for the same reason the image is: deploy-aws.sh
# sed-substitutes the real terraform output (app_irsa_role_arn) in, since baking a real IAM role
# ARN into a committed manifest would go stale the moment the role is ever recreated.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grid-meter-app
  annotations:
    eks.amazonaws.com/role-arn: PLACEHOLDER_APP_IRSA_ROLE_ARN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: grid-meter-app
      containers:
        - name: api
          image: PLACEHOLDER_ECR_API_IMAGE
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATA_REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATA_REDIS_PORT
            # The three below feed config.aws.AwsRedisConfig, gated behind the "cloud-aws" profile
            # (SPRING_PROFILES_ACTIVE above is "cloud,cloud-aws" here, not just "cloud" - see
            # application.yml's cloud-aws profile block). AWS_REGION is the AWS SDK's own standard
            # env var name (DefaultCredentialsProvider/region chain read it directly), not a
            # GRID_METER_*-prefixed one, deliberately matching that convention instead of this
            # project's own.
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: AWS_REGION
            - name: GRID_METER_AWS_ELASTICACHE_USER_ID
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: GRID_METER_AWS_ELASTICACHE_USER_ID
            - name: GRID_METER_AWS_ELASTICACHE_REPLICATION_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: GRID_METER_AWS_ELASTICACHE_REPLICATION_GROUP_ID
            - name: GRID_METER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: GRID_METER_JWT_SECRET
            - name: GRID_METER_TRACING_SAMPLING_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: GRID_METER_TRACING_SAMPLING_PROBABILITY
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: JAVA_TOOL_OPTIONS
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
          ports:
            - containerPort: 8080
          # Found via a real live restart-loop (2026-09-23, first real redeploy after this
          # session's Terraform fixes): `kubectl describe pod` showed BOTH "connection refused"
          # (probe fired before Tomcat bound - real measured Spring Boot startup is ~25s, exceeding
          # readiness's old 20s initialDelaySeconds) AND, critically, persistent "context deadline
          # exceeded" failures continuing up to 89 seconds into the container's life - long after
          # Tomcat was confirmed up in the app's own logs. The default 1s timeoutSeconds is simply
          # too tight for /actuator/health here: its DataSource/Kafka health indicators do real
          # synchronous network round-trips (RDS, self-hosted Kafka), which routinely exceed 1s
          # under real cloud latency even once the app is otherwise fully healthy - kind's
          # near-zero local latency never surfaced this. initialDelaySeconds raised for startup
          # margin AND timeoutSeconds raised for steady-state margin - the delay fix alone
          # wouldn't have been sufficient given failures continued well past the startup window.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              # 512Mi (kind's value) confirmed too tight here via a real live diagnostic
              # (2026-09-18): the container was OOMKilled (exit 137) before Spring Boot even
              # logged past "active profile: cloud" - -Xmx384m only bounds heap, and this app's
              # own startup footprint (JPA/Hibernate, Spring Security, the Kafka client, full
              # Micrometer/OpenTelemetry tracing all initializing at once) needs real headroom
              # beyond that for metaspace/native memory that kind's environment apparently had
              # more slack for. 1Gi is the value confirmed working via the same live test, not a
              # guess - re-verify if this app's own startup footprint changes meaningfully.
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
