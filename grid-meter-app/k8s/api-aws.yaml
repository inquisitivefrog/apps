# AWS-target variant of api.yaml. Same Deployment shape (2 replicas, matching the "scale api=2"
# story everywhere else), different env var wiring: SPRING_PROFILES_ACTIVE=cloud,cloud-aws-password
# activates application.yml's plain host/port Redis block instead of Sentinel discovery (see that
# file's own comment for why - a managed Redis endpoint has no Sentinel process to discover at
# all) plus the AWS password-auth ElastiCache block, and SPRING_DATA_REDIS_HOST/PORT replace
# SPRING_REDIS_SENTINEL_MASTER/NODES entirely. Kafka stays wired exactly as kind's api.yaml does
# - self-hosted in-cluster identically on every target.
#
# image below is a placeholder - deploy-aws.sh applies this file as-is, then runs
# `kubectl set image` immediately after with the real ECR image reference (a deploy-time fact,
# not something to bake into a static, committed manifest that could go stale).
#
# Changed 2026-10-06 from cloud-aws (IAM auth via IRSA) to cloud-aws-password: this account has a
# hard AWS Organizations SCP blocking iam:CreateOpenIDConnectProvider, making IRSA impossible
# here regardless of IAM policy - see terraform/aws/elasticache-iam-auth.tf's header comment for
# the full finding. The ServiceAccount below no longer carries an IRSA role-arn annotation (there
# is no OIDC provider for EKS's Pod Identity webhook to act on even if one were set) - it exists
# only as an ordinary ServiceAccount now, not an IRSA identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grid-meter-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        fargate: "true" # picked up by terraform/aws/fargate.tf's label-selector Fargate profile - see that file's own comment for why
    spec:
      serviceAccountName: grid-meter-app
      containers:
        - name: api
          image: PLACEHOLDER_ECR_API_IMAGE
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATA_REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATA_REDIS_PORT
            # The two below feed application.yml's "cloud-aws-password" profile block.
            # GRID_METER_AWS_ELASTICACHE_USER_ID doubles as the Redis AUTH username (a real ACL
            # user, "grid-meter-app-app", not Redis's "default" user - AUTH needs both username
            # and password for any non-default identity). AWS_REGION and
            # GRID_METER_AWS_ELASTICACHE_REPLICATION_GROUP_ID are deliberately gone - both were
            # SigV4-token-signing-only (config.aws.AwsRedisConfig's IAM path, still used by
            # "cloud-aws" on any other, non-restricted AWS account), unused by plain password
            # auth.
            - name: GRID_METER_AWS_ELASTICACHE_USER_ID
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: GRID_METER_AWS_ELASTICACHE_USER_ID
            - name: GRID_METER_AWS_ELASTICACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: GRID_METER_AWS_ELASTICACHE_PASSWORD
            - name: GRID_METER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: GRID_METER_JWT_SECRET
            - name: GRID_METER_TRACING_SAMPLING_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: GRID_METER_TRACING_SAMPLING_PROBABILITY
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: JAVA_TOOL_OPTIONS
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
          ports:
            - containerPort: 8080
          # Found via a real live restart-loop (2026-09-23, first real redeploy after this
          # session's Terraform fixes): `kubectl describe pod` showed BOTH "connection refused"
          # (probe fired before Tomcat bound - real measured Spring Boot startup is ~25s, exceeding
          # readiness's old 20s initialDelaySeconds) AND, critically, persistent "context deadline
          # exceeded" failures continuing up to 89 seconds into the container's life - long after
          # Tomcat was confirmed up in the app's own logs. The default 1s timeoutSeconds is simply
          # too tight for /actuator/health here: its DataSource/Kafka health indicators do real
          # synchronous network round-trips (RDS, self-hosted Kafka), which routinely exceed 1s
          # under real cloud latency even once the app is otherwise fully healthy - kind's
          # near-zero local latency never surfaced this. initialDelaySeconds raised for startup
          # margin AND timeoutSeconds raised for steady-state margin - the delay fix alone
          # wouldn't have been sufficient given failures continued well past the startup window.
          #
          # Raised again 2026-10-06 after moving api to Fargate (fargate.tf): real measured
          # startup time jumped to 92.69s (Spring Boot's own "Started GridMeterApiApplication"
          # log timestamp), nearly 4x the ~25s this was tuned against on the EC2 node group -
          # confirmed live via a crash-loop where the app logged a clean startup immediately
          # followed by graceful shutdown, each cycle. Root cause: the OLD livenessProbe
          # (initialDelaySeconds 45 + periodSeconds 10 x default failureThreshold 3 = killed at
          # 75s) was killing the container ~17s before Spring Boot ever finished starting -
          # not a slow-probe-response problem like the readiness fix above, a probe firing
          # before the app exists at all. Whether this is Fargate's own CPU/network
          # provisioning being genuinely slower than the EC2 node group, or some other
          # Fargate-specific factor, wasn't isolated further - the fix is the same either way.
          # Generous margin added (not just matched to 92.69s) since Fargate startup time may
          # vary run-to-run in ways not yet observed across multiple deploys.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 100
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              # 512Mi (kind's value) confirmed too tight here via a real live diagnostic
              # (2026-09-18): the container was OOMKilled (exit 137) before Spring Boot even
              # logged past "active profile: cloud" - -Xmx384m only bounds heap, and this app's
              # own startup footprint (JPA/Hibernate, Spring Security, the Kafka client, full
              # Micrometer/OpenTelemetry tracing all initializing at once) needs real headroom
              # beyond that for metaspace/native memory that kind's environment apparently had
              # more slack for. 1Gi is the value confirmed working via the same live test, not a
              # guess - re-verify if this app's own startup footprint changes meaningfully.
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
