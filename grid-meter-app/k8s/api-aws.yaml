# AWS-target variant of api.yaml. Same Deployment shape (2 replicas, matching the "scale api=2"
# story everywhere else), different env var wiring: SPRING_PROFILES_ACTIVE=cloud activates
# application.yml's plain host/port Redis block instead of Sentinel discovery (see that file's
# own comment for why - a managed Redis endpoint has no Sentinel process to discover at all), and
# SPRING_DATA_REDIS_HOST/PORT replace SPRING_REDIS_SENTINEL_MASTER/NODES entirely. Kafka stays
# wired exactly as kind's api.yaml does - self-hosted in-cluster identically on every target.
#
# image below is a placeholder - deploy-aws.sh applies this file as-is, then runs
# `kubectl set image` immediately after with the real ECR image reference (a deploy-time fact,
# not something to bake into a static, committed manifest that could go stale).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: PLACEHOLDER_ECR_API_IMAGE
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATA_REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATA_REDIS_PORT
            - name: GRID_METER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: GRID_METER_JWT_SECRET
            - name: GRID_METER_TRACING_SAMPLING_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: GRID_METER_TRACING_SAMPLING_PROBABILITY
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: JAVA_TOOL_OPTIONS
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            limits:
              # 512Mi (kind's value) confirmed too tight here via a real live diagnostic
              # (2026-09-18): the container was OOMKilled (exit 137) before Spring Boot even
              # logged past "active profile: cloud" - -Xmx384m only bounds heap, and this app's
              # own startup footprint (JPA/Hibernate, Spring Security, the Kafka client, full
              # Micrometer/OpenTelemetry tracing all initializing at once) needs real headroom
              # beyond that for metaspace/native memory that kind's environment apparently had
              # more slack for. 1Gi is the value confirmed working via the same live test, not a
              # guess - re-verify if this app's own startup footprint changes meaningfully.
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
