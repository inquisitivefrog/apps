# Azure-target variant of api.yaml, Azure counterpart of api-aws.yaml/api-gcp.yaml. Same
# Deployment shape (2 replicas), same SPRING_PROFILES_ACTIVE=cloud / SPRING_DATA_REDIS_HOST+PORT
# wiring both other variants use. Postgres Flexible Server's private VNet integration and Managed
# Redis's public endpoint (rediscache.tf's header comment - no VNet-injection attribute exists at
# the Balanced_B0 tier) are both directly reachable from pods without a proxy sidecar, matching how
# AWS's RDS/ElastiCache and GCP's Cloud SQL/Memorystore endpoints are used directly.
#
# Redis will NOT actually authenticate yet even once this is deployed - Managed Redis is Entra
# ID-token-only (rediscache.tf) and the app's spring.data.redis.* client has no credential
# provider for that (terraform/azure/README.md's "What's next"). SPRING_DATA_REDIS_HOST/PORT are
# still wired here, forward-compatible with that work landing, matching how AWS's/GCP's own
# manifests don't special-case a not-yet-built feature either.
#
# image below is a placeholder - matching AWS's/GCP's own "bake in the real image before the
# first apply, not patch after" design (see deploy-aws.sh's comment on why apply-then-patch caused
# wasteful ReplicaSet churn), deploy-azure.sh substitutes the real image via `sed` before this
# file ever reaches kubectl, same as both siblings.
#
# memory: 1Gi from the start, not kind's 512Mi - AWS's live finding (2026-09-18, confirmed
# transferable on GCP's identical build) applied proactively here too: 512Mi OOMKills this
# container (exit 137) before Spring Boot logs past the active profile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: PLACEHOLDER_ACR_API_IMAGE
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATA_REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATA_REDIS_PORT
            - name: GRID_METER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: GRID_METER_JWT_SECRET
            - name: GRID_METER_TRACING_SAMPLING_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: GRID_METER_TRACING_SAMPLING_PROBABILITY
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: JAVA_TOOL_OPTIONS
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
          ports:
            - containerPort: 8080
          # initialDelaySeconds/timeoutSeconds set here from the start (not copied from a stale
          # default) - a real live restart-loop against AWS (api-aws.yaml's original probe block)
          # found real Spring Boot startup measured ~25s and, critically, /actuator/health's
          # DataSource/Kafka health indicators doing real synchronous network round-trips that
          # exceeded the default 1s timeoutSeconds even once the app was otherwise fully healthy.
          # Applied proactively here rather than waiting for Azure's own first live deploy to
          # rediscover the identical mechanism against Postgres Flexible Server/self-hosted Kafka.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
