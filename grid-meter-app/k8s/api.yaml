# 2 replicas, matching docker-compose.yml's `docker compose up --scale api=2` story — here
# it's the deployment's steady-state replica count instead of an explicit scale flag, since k8s
# manages replicas declaratively. image is built + `kind load docker-image`'d locally, not
# pulled from a registry — see k8s/README.md's prerequisites.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: grid-meter-api:kind
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_REDIS_SENTINEL_MASTER
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_REDIS_SENTINEL_MASTER
            - name: SPRING_REDIS_SENTINEL_NODES
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_REDIS_SENTINEL_NODES
            - name: GRID_METER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: GRID_METER_JWT_SECRET
            - name: GRID_METER_TRACING_SAMPLING_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: GRID_METER_TRACING_SAMPLING_PROBABILITY
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: JAVA_TOOL_OPTIONS
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
          ports:
            - containerPort: 8080
          # initialDelaySeconds/timeoutSeconds raised 2026-09-23 after a real live restart-loop
          # against AWS (api-aws.yaml's identical probe block) - real Spring Boot startup measured
          # ~25s (exceeding the old 20s readiness delay), and critically, /actuator/health's
          # DataSource/Kafka health indicators do real synchronous network round-trips that
          # exceeded the default 1s timeoutSeconds even once the app was otherwise fully healthy.
          # kind's near-zero local latency never surfaced this - applied here anyway for
          # consistency across every target and because the wider margin is harmless locally too.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            # Guaranteed CPU share under node contention (see traefik.yaml's note on the
            # 2026-11-18 spike runs); no CPU limit, so it can still burst.
            requests:
              cpu: 500m
            limits:
              # Matches docker-compose.yml's api limit (raised 512m -> 768m there 2026-08-26): with
              # -Xmx384m (configmap.yaml), 512Mi left ~128MB for metaspace, JIT code cache and up to
              # 200 Tomcat thread stacks. Never carried over to kind until the first 600-thread
              # rapid-spike here (2026-11-18) OOMKilled both replicas within 5s of the spike.
              # 768Mi then OOMKilled too at 600 threads once the node had CPU to spare: measured
              # peak heap 288 + non-heap 218 + ~240 thread stacks (239 live threads, Tomcat at its
              # 200 max) = ~746MiB. 1Gi matches api-gcp.yaml/api-azure.yaml.
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  # ServiceMonitor (servicemonitor-api.yaml) matches against THIS metadata.labels block, not
  # spec.selector below (that one's for pod routing, a separate mechanism) -- confirmed live: the
  # api target was silently absent from Prometheus until this label existed, not erroring, just
  # not discovered.
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
