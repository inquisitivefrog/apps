# 2 replicas, matching docker-compose.yml's `docker compose up --scale api=2` story — here
# it's the deployment's steady-state replica count instead of an explicit scale flag, since k8s
# manages replicas declaratively. image is built + `kind load docker-image`'d locally, not
# pulled from a registry — see k8s/README.md's prerequisites.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: grid-meter-api:kind
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_REDIS_HOST
            - name: SPRING_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: SPRING_REDIS_PORT
            - name: GRID_METER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grid-meter-secrets
                  key: GRID_METER_JWT_SECRET
            - name: GRID_METER_TRACING_SAMPLING_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: GRID_METER_TRACING_SAMPLING_PROBABILITY
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: JAVA_TOOL_OPTIONS
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: grid-meter-config
                  key: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
