# Non-secret env vars, mirroring docker-compose.yml's api/postgres service env blocks.
# See secret.yaml for the credential/JWT-key counterparts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grid-meter-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gridmeter
  SPRING_DATASOURCE_USERNAME: gridmeter
  # 3-broker StatefulSet topology (kafka.yaml) -- each pod addressed individually via the
  # headless Service's per-pod DNS, matching docker-compose.yml's kafka-1,kafka-2,kafka-3
  # bootstrap list exactly in shape, just with kind's DNS names instead of Compose's.
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092,kafka-2.kafka-headless:9092
  # Spring Boot 3+ moved these under spring.data.redis.* (SPRING_DATA_REDIS_* via relaxed env-var
  # binding) -- SPRING_REDIS_HOST/PORT (the pre-3.0 namespace) silently bound to nothing, since no
  # explicit ${...} placeholder exists for host/port in application.yml the way the Sentinel keys
  # have. Found while validating this Kafka slice, unrelated to Kafka: docker-compose.yml never
  # exercises this path at all (the app always runs in Sentinel mode there), so this had never
  # actually been proven correct since it was first written -- the same "app-vs-infrastructure,
  # never actually cut over" shape CLAUDE.md already names as a standing risk, just found here on
  # a plain env-var name instead of a routing/topology gap.
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  # This environment's Redis is a single plain instance (k8s/redis.yaml), not the Sentinel
  # topology docker-compose.yml runs -- the app's application.yml activates Redis Sentinel mode
  # for every profile except "test" (see that file's own comment -- Stage 6 of
  # docs/redis-ha-scope.md's app cutover), so "test" is set here deliberately to match this
  # environment's actual topology, the same way SPRING_KAFKA_BOOTSTRAP_SERVERS above is set to
  # match this environment's actual Kafka topology. See k8s/README.md's "Deliberate
  # simplifications" section for why Redis stays single-instance here, and
  # docs/ha-scope.md's "Revisit triggers" for the separate, unscoped k8s Redis Sentinel HA
  # follow-up this doesn't preclude.
  SPRING_PROFILES_ACTIVE: test
  GRID_METER_TRACING_SAMPLING_PROBABILITY: "1.0"
  JAVA_TOOL_OPTIONS: "-Xmx384m"
  MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
  POSTGRES_DB: gridmeter
  POSTGRES_USER: gridmeter
