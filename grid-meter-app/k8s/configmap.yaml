# Non-secret env vars, mirroring docker-compose.yml's api/postgres service env blocks.
# See secret.yaml for the credential/JWT-key counterparts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grid-meter-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gridmeter
  SPRING_DATASOURCE_USERNAME: gridmeter
  # 3-broker StatefulSet topology (kafka.yaml) -- each pod addressed individually via the
  # headless Service's per-pod DNS, matching docker-compose.yml's kafka-1,kafka-2,kafka-3
  # bootstrap list exactly in shape, just with kind's DNS names instead of Compose's.
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092,kafka-2.kafka-headless:9092
  # k8s Redis Sentinel HA follow-up (docs/k8s-redis-ha-scope.md) -- redis.yaml/sentinel.yaml now
  # bring Compose's proven Sentinel topology into kind, matching the Kafka StatefulSet migration's
  # shape. application.yml binds these under spring.data.redis.sentinel.*, but via the literal
  # env-var names SPRING_REDIS_SENTINEL_MASTER/NODES (not SPRING_DATA_REDIS_SENTINEL_*) --
  # confirmed against the real placeholder in application.yml and against docker-compose.yml's own
  # already-working api service, not assumed from the property's Boot-3-namespaced Java path.
  # No SPRING_PROFILES_ACTIVE entry anymore (removed entirely, not set to something else) --
  # application.yml's Sentinel block activates on "!test", so simply not activating any profile
  # here is what turns Sentinel mode on, the same way Compose's api service activates no profile
  # either.
  SPRING_REDIS_SENTINEL_MASTER: mymaster
  SPRING_REDIS_SENTINEL_NODES: sentinel-0.sentinel-headless:26379,sentinel-1.sentinel-headless:26379,sentinel-2.sentinel-headless:26379
  GRID_METER_TRACING_SAMPLING_PROBABILITY: "1.0"
  JAVA_TOOL_OPTIONS: "-Xmx384m"
  MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"
  POSTGRES_DB: gridmeter
  POSTGRES_USER: gridmeter
