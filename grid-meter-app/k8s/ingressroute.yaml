# Same path-based split and priorities as docker-compose.yml's Traefik router labels: api gets
# /api and /actuator (actuator lives outside /api/v1 deliberately — see api-and-data-model.md —
# and needs its own PathPrefix match or it silently falls through to frontend's catch-all),
# frontend gets everything else at lower priority.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grid-meter
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/api`) || PathPrefix(`/actuator`)
      kind: Rule
      priority: 10
      services:
        - name: api
          port: 8080
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: frontend
          port: 80
