# Mirrors docker-compose.yml's loki service exactly -- same image/command, using the image's own
# bundled default config (local-config.yaml), no ConfigMap needed since Compose doesn't mount a
# custom one either. Part of the k8s observability follow-up slice (kube-prometheus-stack handles
# cluster/node metrics separately; this is the app-level logs/traces/dashboards stack).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.7.6
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - name: http
              containerPort: 3100
          resources:
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
