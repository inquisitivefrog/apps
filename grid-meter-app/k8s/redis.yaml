# Redis Sentinel HA, bringing docker-compose.yml's already-proven redis/redis-replica-1/
# redis-replica-2 topology into kind -- the data-node half of this port; see sentinel.yaml for the
# Sentinel half. A StatefulSet (not a Deployment) for the same reason as kafka.yaml: Sentinel's
# failover decisions and this entrypoint's own self-demotion logic (scripts/redis-entrypoint.sh,
# fixing docs/redis-ha-scope.md's Finding A split-brain window) both depend on each node having a
# stable, predictable identity across restarts -- a Deployment's randomly-named, undifferentiated
# pods can't provide that.
#
# Storage stays ephemeral (no volumeClaimTemplates), matching every other component in this slice.
#
# scripts/redis-entrypoint.sh is mounted via ConfigMap rather than baked into a custom image --
# this is the direct k8s-native equivalent of docker-compose.yml's own
# `./scripts/redis-entrypoint.sh:/entrypoint.sh:ro` bind mount (same file, same mechanism in
# spirit), and avoids adding a new custom-image build step to deploy.sh for a single shell script
# when the stock `redis:8.10` image is otherwise unmodified. The ConfigMap itself is generated by
# deploy.sh directly from scripts/redis-entrypoint.sh at deploy time (not duplicated inline here),
# so there's one source of truth shared with Compose, matching deploy-observability.sh's existing
# precedent for the dashboard/alert-rules/tempo-config ConfigMaps.
#
# Per-pod differences a StatefulSet's single shared pod template can't express directly (redis-0
# has no FALLBACK_REPLICAOF_HOST/PORT and is Sentinel's initial bootstrap target;
# redis-1/redis-2 fall back to redis-0 if Sentinel is genuinely unreachable at boot) are computed
# at container-start time from the pod's own ordinal (via the Downward API's POD_NAME field,
# mirroring kafka.yaml's KAFKA_NODE_ID wrapper) rather than by templating separate pod specs.
#
# Deviation from Compose worth calling out explicitly: `--min-replicas-to-write 1
# --min-replicas-max-lag 10` is applied to all 3 pods here, not just the initial primary the way
# Compose's `redis` service alone sets it. A StatefulSet's shared pod template can't single out
# "whichever pod is currently primary" the way Compose's separate per-service config blocks can --
# and since this setting is a no-op on a replica (it only gates a *primary's* write acceptance)
# but becomes active the moment any pod is promoted, applying it uniformly is strictly safer than
# Compose's original shape, not a behavior change to the primary itself.
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis-headless
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10
          command: ["sh", "-c"]
          args:
            - |
              ORDINAL=${POD_NAME##*-}
              export MY_HOSTNAME="${POD_NAME}.redis-headless"
              if [ "$ORDINAL" != "0" ]; then
                export FALLBACK_REPLICAOF_HOST="redis-0.redis-headless"
                export FALLBACK_REPLICAOF_PORT="6379"
              fi
              exec sh /scripts/redis-entrypoint.sh --min-replicas-to-write 1 --min-replicas-max-lag 10 --loglevel debug
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Known upfront (replica count and pod names are fixed) -- pure templating, same
            # reasoning as kafka.yaml's KAFKA_CONTROLLER_QUORUM_VOTERS.
            - name: SENTINEL_HOSTS
              value: "sentinel-0.sentinel-headless sentinel-1.sentinel-headless sentinel-2.sentinel-headless"
          ports:
            - containerPort: 6379
          resources:
            limits:
              memory: 128Mi
          volumeMounts:
            - name: entrypoint-script
              mountPath: /scripts
      volumes:
        - name: entrypoint-script
          configMap:
            name: redis-entrypoint-script
