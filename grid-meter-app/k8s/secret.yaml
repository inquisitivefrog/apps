# Dev-only credentials, same hardcoded gridmeter/gridmeter DB password and JWT signing key
# already committed in plaintext in docker-compose.yml — not real secrets, just modeled as a
# k8s Secret rather than a ConfigMap because "how would you actually do secrets" is a reasonable
# interview question, and it costs little to do properly here even though nothing here is
# actually sensitive at this project's dev-only scope.
apiVersion: v1
kind: Secret
metadata:
  name: grid-meter-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: gridmeter
  POSTGRES_PASSWORD: gridmeter
  GRID_METER_JWT_SECRET: 4H+9b+HAJnUJhWU+mEKE09Onq9J4VzpLkSG3zL4pvAs=
