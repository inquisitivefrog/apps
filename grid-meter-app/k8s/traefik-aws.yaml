# AWS-target variant of traefik.yaml. That file's hostPort/nodeSelector/tolerations/Recreate
# strategy are all kind-specific plumbing tied to kind-config.yaml's local port-80-mapping trick
# (no "ingress-ready" node label exists on real EKS nodes, and hostPort would just bind port 80
# on whatever single worker node the pod happens to land on - not real public reachability).
# Real reachability here comes from a Service: type: LoadBalancer, which provisions a real AWS
# load balancer automatically - matching docs/cloud-deployment-scope.md's own already-decided
# design ("each cloud's own load balancer sits in front of [Traefik] purely for public IP
# assignment"). Traefik itself stays a single instance either way - HA for the edge tier is
# already explicitly out of scope per docs/ha-scope.md.
#
# Changed 2026-10-07 from the in-tree default provider's auto-generated Classic ELB to an
# AWS-Load-Balancer-Controller-managed NLB pinned to a persistent Elastic IP
# (terraform/aws/bootstrap-freetier/eip.tf) - the resume-facing demo URL needs to survive the
# nightly full destroy/rebuild cycle unchanged (confirmed live this session: a Classic ELB's
# hostname is never reusable across recreations, and the in-tree provider has no static-IP
# capability at all - see terraform/aws/load-balancer-controller.tf's header comment for the
# full finding). PLACEHOLDER_EIP_ALLOCATION_ID and PLACEHOLDER_NLB_SUBNET_ID are deploy-time
# facts substituted by k8s/deploy-aws.sh, same pattern as api-aws.yaml's image placeholder.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    app: traefik
spec:
  replicas: 1
  # Default RollingUpdate is fine here - the hostPort-exclusivity problem that forced Recreate
  # on kind doesn't exist once there's no hostPort at all.
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
        fargate: "true" # picked up by terraform/aws/fargate.tf's label-selector Fargate profile - see that file's own comment for why
    spec:
      serviceAccountName: traefik-ingress-controller
      containers:
        - name: traefik
          image: traefik:v3.7.10
          args:
            - --providers.kubernetescrd
            - --entrypoints.web.address=:80
            - --api.dashboard=true
            - --metrics.prometheus=true
          ports:
            - name: web
              containerPort: 80
            - name: metrics
              containerPort: 8080
          resources:
            limits:
              memory: 128Mi
---
# Public-facing - provisions a real AWS Network Load Balancer, pinned to a persistent Elastic IP
# so the public address stays fixed across every nightly destroy/rebuild. This is the one
# resource in this file whose existence has a direct AWS cost line (~$0.025/hr + usage, see
# terraform/aws/README.md) - plus the Elastic IP itself (~$0.005/hr, always-on by design since
# it must survive the main stack's nightly teardown - see bootstrap-freetier/eip.tf).
apiVersion: v1
kind: Service
metadata:
  name: traefik-web
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-eip-allocations: "PLACEHOLDER_EIP_ALLOCATION_ID"
    service.beta.kubernetes.io/aws-load-balancer-subnets: "PLACEHOLDER_NLB_SUBNET_ID"
spec:
  type: LoadBalancer
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
---
# ClusterIP only, same as traefik.yaml's - in-cluster metrics scraping, not a second public
# path.
apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
spec:
  selector:
    app: traefik
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
