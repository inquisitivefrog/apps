# The Traefik controller itself (as opposed to traefik-crds.yaml/traefik-rbac.yaml, vendored
# from Traefik's own official install manifests — see scripts/fetch-traefik-k8s-manifests.sh).
# Plain YAML, not Helm, consistent with this project's "Helm reserved for kube-prometheus-stack
# only" decision (CLAUDE.md).
#
# --providers.kubernetescrd replaces Compose's --providers.docker — otherwise this mirrors
# docker-compose.yml's traefik service (single web entrypoint on :80, dashboard enabled).
#
# nodeSelector/tolerations + hostPort are the standard kind + ingress-controller pattern: they
# land this pod on the node kind-config.yaml's extraPortMappings maps host port 80 onto, so
# http://localhost/... reaches this pod directly with no port-forward step.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    app: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik-ingress-controller
      nodeSelector:
        ingress-ready: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Equal
          effect: NoSchedule
      containers:
        - name: traefik
          image: traefik:v3.7.10
          args:
            - --providers.kubernetescrd
            - --entrypoints.web.address=:80
            - --api.dashboard=true
          ports:
            - name: web
              containerPort: 80
              hostPort: 80
          resources:
            limits:
              memory: 128Mi
