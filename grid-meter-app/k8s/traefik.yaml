# The Traefik controller itself (as opposed to traefik-crds.yaml/traefik-rbac.yaml, vendored
# from Traefik's own official install manifests — see scripts/fetch-traefik-k8s-manifests.sh).
# Plain YAML, not Helm, consistent with this project's "Helm reserved for kube-prometheus-stack
# only" decision (CLAUDE.md).
#
# --providers.kubernetescrd replaces Compose's --providers.docker — otherwise this mirrors
# docker-compose.yml's traefik service (single web entrypoint on :80, dashboard enabled).
#
# nodeSelector/tolerations + hostPort are the standard kind + ingress-controller pattern: they
# land this pod on the node kind-config.yaml's extraPortMappings maps host port 80 onto, so
# http://localhost/... reaches this pod directly with no port-forward step.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    app: traefik
spec:
  replicas: 1
  # hostPort: 80 below is exclusive per node, and kind-config.yaml's ingress-ready label only
  # lands on one node -- the default RollingUpdate strategy tries to schedule the new pod before
  # killing the old one, which can never succeed here (confirmed live: "didn't have free ports for
  # the requested pod ports"). Recreate kills the old pod first, freeing the port for the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik-ingress-controller
      nodeSelector:
        ingress-ready: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Equal
          effect: NoSchedule
      containers:
        - name: traefik
          image: traefik:v3.7.10
          args:
            - --providers.kubernetescrd
            - --entrypoints.web.address=:80
            - --api.dashboard=true
            # Same internal :8080 entrypoint as the dashboard/API, at /metrics -- mirrors
            # docker-compose.yml's traefik command. Scraped by the k8s observability follow-up
            # slice's Prometheus via additionalScrapeConfigs (kube-prometheus-stack-values.yaml),
            # not a ServiceMonitor, to avoid hand-editing the vendored traefik-rbac.yaml further.
            - --metrics.prometheus=true
          ports:
            - name: web
              containerPort: 80
              hostPort: 80
            - name: metrics
              containerPort: 8080
          resources:
            limits:
              memory: 128Mi
---
# ClusterIP only -- in-cluster metrics scraping, not a second way to reach the dashboard from the
# host. Doesn't contradict k8s/README.md's "No Traefik dashboard exposed" simplification, which is
# specifically about host-reachability via the IngressRoute/kind port mapping.
apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
spec:
  selector:
    app: traefik
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
