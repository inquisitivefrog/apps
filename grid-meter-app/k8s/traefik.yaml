# The Traefik controller itself (as opposed to traefik-crds.yaml/traefik-rbac.yaml, vendored
# from Traefik's own official install manifests — see scripts/fetch-traefik-k8s-manifests.sh).
# Plain YAML, not Helm, consistent with this project's "Helm reserved for kube-prometheus-stack
# only" decision (CLAUDE.md).
#
# --providers.kubernetescrd replaces Compose's --providers.docker — otherwise this mirrors
# docker-compose.yml's traefik service (single web entrypoint on :80, dashboard enabled).
#
# nodeSelector/tolerations + hostPort are the standard kind + ingress-controller pattern: they
# land this pod on the node kind-config.yaml's extraPortMappings maps host port 80 onto, so
# http://localhost/... reaches this pod directly with no port-forward step.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    app: traefik
spec:
  replicas: 1
  # hostPort: 80 below is exclusive per node, and kind-config.yaml's ingress-ready label only
  # lands on one node -- the default RollingUpdate strategy tries to schedule the new pod before
  # killing the old one, which can never succeed here (confirmed live: "didn't have free ports for
  # the requested pod ports"). Recreate kills the old pod first, freeing the port for the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik-ingress-controller
      nodeSelector:
        ingress-ready: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Equal
          effect: NoSchedule
      containers:
        - name: traefik
          image: traefik:v3.7.10
          args:
            - --providers.kubernetescrd
            - --entrypoints.web.address=:80
            - --api.dashboard=true
            # Same internal :8080 entrypoint as the dashboard/API, at /metrics -- mirrors
            # docker-compose.yml's traefik command. Scraped by the k8s observability follow-up
            # slice's Prometheus via additionalScrapeConfigs (kube-prometheus-stack-values.yaml),
            # not a ServiceMonitor, to avoid hand-editing the vendored traefik-rbac.yaml further.
            - --metrics.prometheus=true
            # Per-router request counts, labeled with the router's service: the only Traefik metric that
            # sees EVERY request to the api routes -- served, 5xx, shed (429 from a middleware) and
            # 'no healthy backend' 503s. traefik_service_requests_total misses the last two (2026-11-18:
            # 199,508 no-backend 503s during a total api outage, 0 on the service metric), so the
            # availability SLI reads this one.
            - --metrics.prometheus.addRoutersLabels=true
            # Default false DROPS a router whose Service has no ready endpoints, so during a total
            # api outage /api/* fell through to the PathPrefix(`/`) frontend route and nginx
            # answered POSTs with 405 -- a 4xx the availability SLO doesn't count, hiding the
            # outage (51,905 of them in the 2026-11-18 600-thread spike). true keeps the router
            # and returns 503.
            - --providers.kubernetescrd.allowEmptyServices=true
          ports:
            - name: web
              containerPort: 80
              hostPort: 80
            - name: metrics
              containerPort: 8080
          resources:
            # The 2026-11-18 600-thread rapid-spike runs on kind: 128Mi was OOMKilled under ~600
            # held connections, and with no CPU request Traefik got the same share as everything
            # else on the one node while Alloy and Tempo took 5-7 cores -- it ended up wedged
            # (a goroutine dump showed 430 requests queued on net/http.Transport's idle-connection
            # mutex, the holder starved of CPU). The request gives the edge a guaranteed share
            # under contention; no CPU limit, so it can still burst.
            requests:
              cpu: 500m
            limits:
              memory: 512Mi  # 256Mi OOMKilled twice at 600 threads (2026-11-18): ~1,200 sockets in and out
---
# ClusterIP only -- in-cluster metrics scraping, not a second way to reach the dashboard from the
# host. Doesn't contradict k8s/README.md's "No Traefik dashboard exposed" simplification, which is
# specifically about host-reachability via the IngressRoute/kind port mapping.
apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
spec:
  selector:
    app: traefik
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
