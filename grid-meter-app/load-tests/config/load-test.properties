# Shared connection settings for every profile, loaded via `jmeter -q config/load-test.properties`
# (-q merges additional properties on top of JMeter's own defaults; -p would replace them
# entirely, breaking the HTML dashboard report generator's own template properties).
# Per-profile load shape (threads/ramp-up/duration/think time) lives in each .jmx's own defaults
# instead of here, so `steady-state.jmx`, `ramp-up.jmx`, `spike.jmx`, and `soak.jmx` stay genuinely
# distinct profiles rather than one generic template — see ../README.md. Any property here (or a
# profile's own defaults) can still be overridden per run with -J, e.g. `-Jthreads=50`.

# Traefik on localhost:80, matching local `docker compose up` per CLAUDE.md's dev workflow.
host=localhost
port=80
basePath=/api/v1

# Seed demo user, Flyway-seeded in V3__create_users_table.sql (see docs/api-and-data-model.md).
loginUsername=demo
loginPassword=GridMeter!Demo2026

# How many meters the setUp Thread Group provisions before the main load begins.
meterPoolSize=10

# Where the provisioned meter pool's IDs are written/read from — relative to load-tests/, i.e.
# where `jmeter` is invoked from (see run.sh).
meterCsvPath=results/meter-pool.csv
