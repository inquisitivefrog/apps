apiVersion: 1

groups:
  - orgId: 1
    name: grid-meter-alerts
    folder: grid-meter-app
    interval: 30s
    rules:
      # Fires when Prometheus can't scrape the api job at all -- covers the 'api' link outage in
      # load-tests/chaos-demo.sh. Note: Prometheus scrapes api:8080 directly over the Docker
      # network, bypassing Traefik entirely, so this does NOT fire during a 'traefik' outage --
      # that's an honest scope boundary, not an oversight (see docs/architecture.md's routing
      # section for why Prometheus scrapes the app directly).
      - uid: api-down
        title: API is down
        condition: C
        for: 30s
        labels:
          severity: critical
          alert_class: incident
        annotations:
          summary: "Prometheus cannot scrape grid-meter-api -- the API is unreachable."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: 'up{job="grid-meter-api"}'
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # Fires on a sustained HTTP error rate -- covers the 'postgres' link outage (reads start
      # failing) and any real application-level failure spike.
      - uid: high-error-rate
        title: High HTTP error rate
        condition: C
        for: 30s
        labels:
          severity: warning
          alert_class: incident
        annotations:
          summary: "HTTP error rate has exceeded 5% for 30s."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: '100 * (sum(rate(http_server_requests_seconds_count{outcome=~"CLIENT_ERROR|SERVER_ERROR"}[5m])) or vector(0)) / sum(rate(http_server_requests_seconds_count[5m]))'
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }

      # Fires on a sustained edge-level 5xx rate at Traefik itself -- covers what
      # high-error-rate (above) structurally cannot: a request Tomcat's accept-count queue
      # refuses never reaches api's own Spring MVC layer at all, so Micrometer's
      # http.server.requests metric never records it, success or failure. Traefik is what
      # generates the resulting 502, so its own request/status metric is the only place this
      # failure class is visible. See load-tests/README.md's misconfigured-spike-demo.sh section
      # for the real diagnostic (a live burst with genuine 9% app-level errors produced a
      # 0% high-error-rate reading throughout) that found this gap.
      #
      # service="grid-meter-api-edge" is a canonical value neither Prometheus's Docker nor
      # Kubernetes provider produces natively -- both environments' own scrape config relabels
      # toward it (observability/prometheus.yml for Compose's "api@docker",
      # k8s/kube-prometheus-stack-values.yaml for k8s's unstable hashed "...@kubernetescrd" name),
      # so this one rule definition works unchanged in both rather than hardcoding either
      # environment's actual label value into the query text.
      - uid: edge-5xx-rate
        title: High Traefik edge error rate
        condition: C
        for: 30s
        labels:
          severity: warning
          alert_class: incident
        annotations:
          summary: "Traefik's 5xx rate for the api service has exceeded 5% for 30s."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: '100 * (sum(rate(traefik_service_requests_total{service="grid-meter-api-edge", code=~"5.."}[5m])) or vector(0)) / sum(rate(traefik_service_requests_total{service="grid-meter-api-edge"}[5m]))'
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }

      # Fires when Tomcat's thread pool is under real saturation pressure (see
      # load-tests/README.md's spike profile, which deliberately drives this).
      - uid: tomcat-threads-saturated
        title: Tomcat thread pool saturated
        condition: C
        for: 30s
        labels:
          severity: warning
          alert_class: incident
        annotations:
          summary: "Tomcat busy threads have exceeded 80% of the configured max for 30s."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: '100 * tomcat_threads_busy_threads / tomcat_threads_config_max_threads'
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }

      # Fires on ANY increase, not a threshold/percentage like the other 4 rules -- a single
      # occurrence is a real reading permanently lost (confirmed via the 150s Kafka quorum-loss
      # test, load-tests/kafka-ha-demo.sh: ReadingService.ingest() never checks kafkaTemplate.
      # send()'s returned Future, so a delivery failure has no other path back to the caller).
      # This makes the loss observable, not prevented -- the durable fix is an outbox
      # (docs/resilience-scope.md, not built yet), so this alert firing means data is already gone,
      # not just at risk.
      - uid: reading-delivery-failures
        title: Reading delivery failures
        condition: C
        for: 30s
        labels:
          severity: critical
          alert_class: incident
        annotations:
          summary: "At least one reading failed to publish to Kafka and landed in reading_outbox instead -- it is NOT yet visible via GET /readings (no reconciler drains the outbox back to Kafka yet, see docs/resilience-scope.md Stage D)."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: 'increase(reading_delivery_failures_total[5m]) or vector(0)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
