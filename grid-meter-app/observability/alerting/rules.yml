apiVersion: 1

groups:
  - orgId: 1
    name: grid-meter-alerts
    folder: grid-meter-app
    interval: 30s
    rules:
      # Fires when Prometheus can't scrape the api job at all -- covers the 'api' link outage in
      # load-tests/chaos-demo.sh. Note: Prometheus scrapes api:8080 directly over the Docker
      # network, bypassing Traefik entirely, so this does NOT fire during a 'traefik' outage --
      # that's an honest scope boundary, not an oversight (see docs/architecture.md's routing
      # section for why Prometheus scrapes the app directly).
      - uid: api-down
        title: API is down
        condition: C
        for: 30s
        labels:
          severity: critical
          alert_class: incident
        annotations:
          summary: "Prometheus cannot scrape grid-meter-api -- the API is unreachable."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: 'up{job="grid-meter-api"}'
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # Fires on a sustained HTTP error rate -- covers the 'postgres' link outage (reads start
      # failing) and any real application-level failure spike.
      - uid: high-error-rate
        title: High HTTP error rate
        condition: C
        for: 30s
        labels:
          severity: warning
          alert_class: incident
        annotations:
          summary: "HTTP error rate has exceeded 5% for 30s."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: '100 * (sum(rate(http_server_requests_seconds_count{outcome=~"CLIENT_ERROR|SERVER_ERROR"}[5m])) or vector(0)) / sum(rate(http_server_requests_seconds_count[5m]))'
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }

      # Fires on a sustained edge-level 5xx rate at Traefik itself -- covers what
      # high-error-rate (above) structurally cannot: a request Tomcat's accept-count queue
      # refuses never reaches api's own Spring MVC layer at all, so Micrometer's
      # http.server.requests metric never records it, success or failure. Traefik is what
      # generates the resulting 502, so its own request/status metric is the only place this
      # failure class is visible. See load-tests/README.md's misconfigured-spike-demo.sh section
      # for the real diagnostic (a live burst with genuine 9% app-level errors produced a
      # 0% high-error-rate reading throughout) that found this gap.
      #
      # service="grid-meter-api-edge" is a canonical value neither Prometheus's Docker nor
      # Kubernetes provider produces natively -- both environments' own scrape config relabels
      # toward it (observability/prometheus.yml for Compose's "api@docker",
      # k8s/kube-prometheus-stack-values.yaml for k8s's unstable hashed "...@kubernetescrd" name),
      # so this one rule definition works unchanged in both rather than hardcoding either
      # environment's actual label value into the query text.
      - uid: edge-5xx-rate
        title: High Traefik edge error rate
        condition: C
        for: 30s
        labels:
          severity: warning
          alert_class: incident
        annotations:
          summary: "Traefik's 5xx rate for the api service has exceeded 5% for 30s."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: '100 * (sum(rate(traefik_service_requests_total{service="grid-meter-api-edge", code=~"5.."}[5m])) or vector(0)) / sum(rate(traefik_service_requests_total{service="grid-meter-api-edge"}[5m]))'
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }

      # Fires when Tomcat's thread pool is under real saturation pressure (see
      # load-tests/README.md's spike profile, which deliberately drives this).
      - uid: tomcat-threads-saturated
        title: Tomcat thread pool saturated
        condition: C
        for: 30s
        labels:
          severity: warning
          alert_class: incident
        annotations:
          summary: "Tomcat busy threads have exceeded 80% of the configured max for 30s."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: '100 * tomcat_threads_busy_threads / tomcat_threads_config_max_threads'
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }

      # Fires on ANY increase, not a threshold/percentage like the other rules -- a single
      # occurrence is a real reading permanently lost (confirmed via the 150s Kafka quorum-loss
      # test, load-tests/kafka-ha-demo.sh: without this, a delivery failure had no other path back
      # to the caller, since POST /readings already returned 201 before Kafka ever acknowledged).
      # A transactional-outbox pattern was built and load-tested as a durable fix, then
      # deliberately retired (docs/resilience-scope.md): a lost simulated meter reading has no
      # real downstream consequence (no billing, no regulatory record, nothing to redo).
      #
      # Classified as a NOTICE (docs/observability-taxonomy.md §3), not an incident, per the same
      # redo-path reasoning that retired the outbox: "permanently lost" doesn't imply "worth
      # interrupting someone about" when the lost thing has no real downstream consequence. The
      # counter/log/this rule together are a durable record to consult if anyone asks, not a page.
      # Resource-capacity trend alert (docs/observability-taxonomy.md §2), not an incident --
      # alert_class/severity below deliberately don't page anyone. Built for
      # docs/testing-expansion-scope.md §1.3: soak.jmx's own header comment used to just say
      # "watch JVM heap trend in Grafana over the full run", which only worked with a human
      # staring at a dashboard. This is the automated version.
      #
      # jvm_gc_live_data_size_bytes is Micrometer's purpose-built metric for exactly what §1.3
      # asked for -- old-gen (Tenured Gen, confirmed live against this app's actual JVM: no
      # -XX:+UseG1GC is set anywhere in docker-compose.yml/k8s, and this app's small -Xmx384m
      # heap gets Serial GC under JVM ergonomics, not G1 -- "gc=Copy" young-gen pause metric and
      # a "Tenured Gen" pool id confirmed via a live curl of /actuator/prometheus, not assumed)
      # size sampled only on full/major GC events, not every scrape -- unlike raw
      # jvm_memory_used_bytes{area="heap"} (already on the overview dashboard), it doesn't
      # oscillate with normal eden/survivor allocation churn, so a real upward slope in it means
      # something is surviving major collections that shouldn't be.
      #
      # predict_linear() over a 6h window projects the value 7 days out and expresses it as a %
      # of jvm_gc_max_data_size_bytes (old-gen capacity after a full GC) -- "projected to hit 80%
      # by <date>" per the taxonomy doc's framing, not a hard current-value threshold. Reads as
      # 0% with no slope until this app has actually run long/hard enough to trigger real major
      # GCs, which is expected and correct: no major GC yet means no post-GC trend to evaluate.
      - uid: heap-after-gc-trend
        title: JVM old-gen heap trending toward exhaustion
        condition: C
        for: 5m
        labels:
          severity: info
          alert_class: trend
        annotations:
          summary: "Old-gen heap size after major GC is on a slope that would reach 80% of capacity within 7 days at the current rate -- a candidate slow leak, not an active incident. Record-only, not paged -- see docs/observability-taxonomy.md and docs/testing-expansion-scope.md §1.3."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 21600, to: 0 }
            model:
              refId: A
              expr: '100 * clamp_min(predict_linear(jvm_gc_live_data_size_bytes[6h], 7 * 24 * 3600), 0) / jvm_gc_max_data_size_bytes'
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }

      - uid: reading-delivery-failures
        title: Reading delivery failures
        condition: C
        for: 30s
        labels:
          severity: info
          alert_class: notice
        annotations:
          summary: "At least one reading failed to publish to Kafka after client-side retries were exhausted -- it is permanently lost (accepted per docs/resilience-scope.md's redo-path scope decision, not a recoverable delay). Record-only, not paged -- see docs/observability-taxonomy.md."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: 'increase(reading_delivery_failures_total[5m]) or vector(0)'
              instant: true
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
