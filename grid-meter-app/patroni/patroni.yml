# Shared bootstrap config for all 3 Patroni nodes -- everything node-specific (name, connect
# addresses, credentials, which Consul agent) is supplied via PATRONI_* env vars in
# docker-compose.yml, which override values here. This file exists only because the `bootstrap`
# section (how a brand-new cluster gets initialized) has no environment-variable equivalent at
# all -- confirmed directly against Patroni's own ENVIRONMENT.rst rather than assumed, after a
# first attempt sat indefinitely logging "waiting for leader to bootstrap" with no config telling
# it self-initialization was even an option.
#
# synchronous_mode: quorum + synchronous_node_count: 1 closes the exact gap found in
# docs/postgres-ha-scope.md's Stage 1 config audit (synchronous_standby_names was undeclared,
# running fully async) -- the correct, Patroni-native fix, since Patroni owns and dynamically
# manages synchronous_standby_names itself once this is set, rather than a static postgresql.conf
# value that wouldn't track topology changes (a new replica joining, one leaving) the way Patroni's
# own management does.
#
# quorum (not the simpler `true`, which defaults to single named-standby mode) was a real,
# explicitly-confirmed decision, not the obvious choice: Patroni's own bare `synchronous_mode: true`
# default pins durability to whichever one replica happens to register first, an asymmetry that
# contradicts this project's own reason for running 2 replicas ("always a spare") -- see
# docs/postgres-ha-scope.md's "Open decision" section for the full account, including how this
# exact setting briefly went live as the *undecided* default during Stage 2 before being caught and
# fixed. This value must stay declared here, in the bootstrap file, not only pushed live via
# `patronictl edit-config` -- this cluster deliberately has no persistent volume (resets cleanly via
# --force-recreate between test runs), so a fresh bootstrap reads this file again from scratch, and
# a live-only DCS change wouldn't survive that.
#
# log.level: DEBUG -- enabled ahead of any Stage 3+ failure testing, same hard-learned lesson from
# the Kafka investigation's Run 1 gap (no TRACE-level evidence captured because the debug overlay
# wasn't in place before the first real failure was introduced). This is a top-level key (Patroni's
# own process logging), not part of `bootstrap` (which only affects brand-new-cluster init).
log:
  level: DEBUG

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: quorum
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: true
  initdb:
    - encoding: UTF8
    - data-checksums
  # Dev-only, no real security posture -- matches this project's existing hardcoded
  # gridmeter/gridmeter convention for the app's own `postgres` service. 0.0.0.0/0 is appropriate
  # for a local Docker Compose investigation, not a production stance.
  pg_hba:
    - host replication replicator 0.0.0.0/0 md5
    - host all all 0.0.0.0/0 md5
  # Found missing during the app cutover (docs/postgres-ha-scope.md's "Real, still-open gap"
  # section): the bootstrap section above only ever created the postgres superuser -- unlike the
  # standalone `postgres` service, which gets its `gridmeter` role/database for free from the
  # official image's POSTGRES_USER/POSTGRES_DB env vars, this cluster never had an equivalent.
  #
  # A `bootstrap.users` key was tried first and looked plausible, but is dead in this Patroni
  # version -- confirmed directly against Patroni 4.1.5's own bootstrap.py, not assumed from
  # older docs/memory: `post_bootstrap()` explicitly checks `config.get('users')` and only
  # `logger.error('User creation is not be supported starting from v4.0.0. Please use
  # "bootstrap.post_bootstrap" script to create users.')` -- it silently does nothing beyond that
  # log line. This was only discovered by actually exercising a from-scratch bootstrap (this
  # project's own standing "an unfired hook is an unverified claim" discipline): the role never
  # got created, so `post_bootstrap`'s own `CREATE DATABASE ... OWNER gridmeter` failed with
  # `role "gridmeter" does not exist`, and Patroni treats a failing post_bootstrap script as fatal
  # -- it renames the just-initialized data directory to `.failed` and aborts the whole bootstrap,
  # not just the one statement. Fixed per Patroni's own error message: both the role and the
  # database are now created inside `post_bootstrap` itself, in the one script Patroni actually
  # still supports for this. Re-verified against a genuine from-scratch bootstrap (full
  # teardown of the Postgres data volumes AND the Consul DCS state for this cluster, so Patroni
  # couldn't mistake it for an existing cluster to rejoin) -- see
  # load-tests/postgres-patroni-fresh-bootstrap-test.sh and
  # load-tests/vendor-bug-reports/postgres/NOTES.md for the full account.
  # Patroni does NOT run this through a shell -- confirmed directly against bootstrap.py's
  # call_post_bootstrap(), which tokenizes the string with shlex.split() and execs the result
  # directly, so a shell-style `&&`-joined two-command string would never work here (it would just
  # get passed to psql as garbage extra arguments, not interpreted as two commands). psql's own
  # support for multiple -c flags in one invocation is the correct way to run two statements here.
  post_bootstrap: >-
    psql -U postgres
    -c "CREATE ROLE gridmeter WITH LOGIN CREATEDB PASSWORD 'gridmeter';"
    -c "CREATE DATABASE gridmeter OWNER gridmeter;"
